// Implements: SPEC-412 (debugging script): log the Ghoul GL calls of one main-menu frame (ref_omgl only)
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
w100
menu main
w100
set r_om_ghltrace 1
w100
quit
