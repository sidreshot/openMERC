// Implements: SPEC-412 (black-box screenshot script)
// Main menu, video menu, start of tsr1. OMSHOT lines make the harness capture the next frame,
// OMTRACE lines log all renderer calls of the next frame (capture shim, test/refcap).
// (No semicolons in comments: the command buffer splits lines at them.)
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
w100
menu main
w100
echo OMSHOT mainmenu
w100
echo OMTRACE mainmenu
w100
menu video
w100
echo OMSHOT video
w100
echo OMTRACE video
w100
map tsr1
w100
w100
w100
w100
w100
echo OMSHOT tsr1
w100
w100
echo OMSHOT tsr1b
w100
echo OMTRACE tsr1
w100
echo OMSHOT tsr1c;echo OMTRACE tsr1c
w100
quit
