// Implements: SPEC-410, SPEC-412 (black-box screenshot script)
// Spawn views of several maps with the level-start cinematics skipped, so the view does not move.
// OMSHOT lines make the harness capture the next frame. (No semicolons in comments.)
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
set sv_jumpcinematic 1
set cl_subtitles 0
map tsr1
w100
w100
w100
echo OMSHOT tsr1
w100
map sib1
w100
w100
w100
echo OMSHOT sib1
w100
map irq3b
w100
w100
w100
echo OMSHOT irq3b
w100
map ger1
w100
w100
w100
echo OMSHOT ger1
w100
map nyc2
w100
w100
w100
echo OMSHOT nyc2
w100
map jpn1
w100
w100
w100
echo OMSHOT jpn1
w100
map trn1
w100
w100
w100
echo OMSHOT trn1
w100
map kos3
w100
w100
w100
echo OMSHOT kos3
w100
quit
