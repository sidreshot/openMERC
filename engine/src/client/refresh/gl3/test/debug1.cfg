// Implements: SPEC-410, SPEC-412 (debugging script)
// nyc2 spawn view with a call trace (alpha quads), irq3b with the fog diagnostic view gl_fogmode 3.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
set sv_jumpcinematic 1
set cl_subtitles 0
map nyc2
w100
w100
w100
echo OMSHOT nyc2;echo OMTRACE nyc2
w100
map irq3b
w100
w100
w100
echo OMSHOT irq3b
w100
set gl_fogmode 3
w100
echo OMSHOT irq3b_fog3
w100
set gl_fogmode 2
w100
echo OMSHOT irq3b_fog2
w100
set gl_fogmode 0
quit
