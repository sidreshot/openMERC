// Implements: SPEC-412 (black-box screenshot script)
// Main menu after start-up, then the console with text. OMSHOT lines make the harness capture the window.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
w100
w100
w100
echo OMSHOT menu
w100
w100
screenshot
w10
toggleconsole
echo OMTEST colour test
w100
echo OMSHOT console
w100
w100
screenshot
w10
quit
