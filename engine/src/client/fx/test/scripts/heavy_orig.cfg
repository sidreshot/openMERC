// Implements: SPEC-400 / SPEC-401 black-box session "heavy": sent to the original client (listen host, cheats on,
// cheat_start.cfg) once the OpenMerc spectator is in place. Takes the bigelbow kit and god mode and fires the
// heavy weapons straight ahead (wall x = -912, pit below), the elbow kit for grenade, C4 and flash pack, moves,
// and fires the rocket launcher last. Both
// clients draw from the same fixed eye above and behind the spawn point, looking over the pit (om_capview here,
// om_fxview in heavy_om.cfg). OMSHOT lines are captures through ref_omcap, w1k is about 1.4 s.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
echo OMTEST origA script
record omheavy
set om_capview "-475 -928 110 24.5 180 0 1"
bigelbow
heretic
w1k
echo OMSHOT h_00
// slug thrower (key 9): slug, then concussion grenade
