// Implements: SPEC-400 black-box session "beams" (run_session.ps1 -OrigBScript): sent to the second original client
// origB (spectator) when the OpenMerc spectator is in place. Stops chasing like beams_om.cfg, draws from the fixed
// eye of beams_om.cfg (om_capview, Ghoul models dropped) and logs one renderer trace (every quad of every chain)
// every 100 waits, with a numbered capture every fourth trace, while origA fires.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias tw "w100;echo OMTRACE tr"
alias ts "w100;echo OMTRACE tr;echo OMSHOT s#"
alias t4 "ts;tw;tw;tw"
alias t40 "t4;t4;t4;t4;t4;t4;t4;t4;t4;t4"
echo OMTEST origB script
+attack
w10
-attack
w100
+attack
w10
-attack
w100
set om_capview "-475 -928 110 24.5 180 0 1"
echo OMSHOT b_00
t40
t40
t40
t40
t40
t40
t40
t40
t40
t40
echo OMSHOT b_99
echo OMTEST origB end
