// Implements: SPEC-400 black-box session "beams": the OpenMerc client joins as a spectator, stops chasing (free
// spectator behind origA), draws from the same fixed eye as beams_specB.cfg (om_fxview), dumps its effect scene
// every 100 ms (om_fxdump, <user>/fxdump) and captures frame bursts after effects (om_fxshot) for the pairs.
// About 200 frames per second: w1k is about 5 s.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
w1k
w1k
w1k
omshot c_pre
+attack
w10
-attack
w100
+attack
w10
-attack
w100
set om_fxview "-475 -928 110 24.5 180 0 1"
set om_fxshotdur 1500
set om_fxshotstep 60
set om_fxshotmax 60
set om_fxshot "*"
set om_fxdump 100
omshot c_00
echo OMTEST chasing
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
set om_fxdump 0
omshot c_99
echo OMTEST end
disconnect
w100
quit
