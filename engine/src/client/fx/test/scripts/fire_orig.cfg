// Implements: SPEC-400 / SPEC-401 black-box session: the original client origA fires the pistol at the wall in
// front of it, turns, fires again, captures its own view (OMSHOT lines, ref_omcap shim), then quits.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
echo OMTEST origA script
weaponselect 2
w100
echo OMSHOT a_0
w100
+attack
w10
-attack
w100
+attack
w10
-attack
w10
echo OMSHOT a_1
w100
w100
+attack
w10
-attack
w100
echo OMSHOT a_2
w100
+right
w10
w10
-right
w100
+attack
w10
-attack
w100
+attack
w10
-attack
w10
echo OMSHOT a_3
w100
w100
w100
echo OMSHOT a_4
w100
w100
echo OMTEST origA end
w100
w100
w100
w100
quit
