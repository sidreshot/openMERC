// Implements: SPEC-400 / SPEC-401 black-box session "debris": sent to the original client (listen host, cheats on,
// cheat_start.cfg). Spawns a breakable brick prop with `gimme` (SPEC-780: 100 units forward, 50 up, it drops to
// the floor; of the chunk props only chunks_brick has a model in the shipped data) and sweeps the assault rifle
// slowly down and up across it until it breaks (TE 18 chunks, SPEC-770 A.3). Both clients draw from the same
// fixed eye beside the prop, Ghoul models kept (7th value 0, the view weapon hidden with cl_gun 0), om_fxview in
// debris_om.cfg. w1k is about 1.4 s.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
// tw: about 0.14 s, then one renderer trace (OMTRACE: the shim logs one frame of renderer calls, entity
// lists included, run_session.ps1 collects them in <tag>-traces), ts: the same plus a numbered capture
alias tw "w100;echo OMTRACE tr"
alias ts "w100;echo OMTRACE tr;echo OMSHOT s#"
alias tw1k "ts;tw;ts;tw;ts;tw;ts;tw;ts;tw"
alias down "+lookdown;+attack;tw1k;tw1k;-attack;-lookdown"
alias up "+lookup;+attack;tw1k;tw1k;-attack;-lookup"
echo OMTEST origA script
set cl_gun 0
set cl_pitchspeed 20
set om_capview "-600 -840 50 29.4 262.2 0 0"
elbow
heretic
weaponselect 7
w1k
gimme misc_generic_chunks_brick
w1k
echo OMSHOT b0_0
down
echo OMSHOT b0_1
up
echo OMSHOT b0_2
down
echo OMSHOT b0_3
up
w100
echo OMSHOT b0_4
tw1k
echo OMSHOT b0_5
centerview
w1k
gimme misc_generic_chunks_brick
w1k
echo OMSHOT b1_0
down
echo OMSHOT b1_1
up
echo OMSHOT b1_2
down
echo OMSHOT b1_3
up
w100
echo OMSHOT b1_4
tw1k
echo OMSHOT b1_5
centerview
w1k
echo OMSHOT d_99
echo OMTEST origA end
w1k
w1k
quit
