// Implements: SPEC-400 / SPEC-401 black-box session: the OpenMerc client joins as a spectator (spectator 1),
// chases the first player (the original client origA, SPEC-780 chase camera) and captures what it sees.
// The harness starts origA's script when "OMTEST chasing" appears in this client's log.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
w1k
w1k
w1k
omshot c_pre
+attack
w10
-attack
w100
echo OMTEST chasing
w100
omshot c_00
w1k
omshot c_01
w1k
omshot c_02
w1k
omshot c_03
w1k
omshot c_04
w1k
omshot c_05
w1k
omshot c_06
w1k
omshot c_07
w1k
omshot c_08
echo OMTEST end
disconnect
w100
quit
