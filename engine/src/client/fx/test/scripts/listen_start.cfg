// Implements: SPEC-400 / SPEC-401 black-box session: the original client starts a deathmatch listen server
// (run_session.ps1 puts ip, port and public 0 in front of these lines).
set deathmatch 1
set maxclients 4
set timelimit 0
set fraglimit 0
map dm/jpndm2
