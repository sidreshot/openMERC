// Implements: SPEC-400 black-box session "beams" (run_session.ps1 -OrigBScript): sent to the original listen host
// origA (cheats on, cheat_start.cfg), which only shoots: holds the MPG beam, then the flame gun stream, each about
// 3 s, straight ahead at the wall x = -912. The server sends these effects (svc_effect mpgbeam1/2, fthrower) to the
// other clients only, so the original spectator origB (beams_specB.cfg) and the OpenMerc spectator (beams_om.cfg)
// are compared. w1k is about 1.4 s on the host.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
echo OMTEST origA script
bigelbow
heretic
w1k
w1k
weaponselect 12
w1k
w1k
echo OMTEST mpg
+attack
w1k
w1k
-attack
w1k
w1k
w1k
weaponselect 11
w1k
w1k
echo OMTEST flame
+attack
w1k
w1k
-attack
w1k
w1k
echo OMTEST origA end
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
quit
