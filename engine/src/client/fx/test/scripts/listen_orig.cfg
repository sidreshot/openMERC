// Implements: SPEC-400 / SPEC-401 black-box session: sent to the original client (listen server host) once the
// OpenMerc spectator chases it: fires the pistol at the wall in front, turns, fires
// again. About 700 frames per second: w1k is about 1.4 s. OMSHOT lines are captures through ref_omcap.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
alias w10k "w1k;w1k;w1k;w1k;w1k;w1k;w1k;w1k;w1k;w1k"
echo OMTEST origA script
echo OMSHOT a_0
weaponselect 2
w1k
w1k
+attack
w100
-attack
w1k
w1k
+attack
w100
-attack
w1k
echo OMSHOT a_1
w1k
w1k
w1k
+attack
w100
-attack
w1k
w1k
echo OMSHOT a_2
w1k
+right
w100
w100
-right
w1k
+attack
w100
-attack
w1k
w1k
+attack
w100
-attack
w1k
echo OMSHOT a_3
w10k
echo OMSHOT a_4
w10k
echo OMTEST origA end
quit
