// Implements: SPEC-400 / SPEC-401 black-box session "heavy": the OpenMerc client joins as a spectator, chases
// the original client origA (listen host), then stops chasing (stays there), draws from the same fixed eye as the original (om_fxview =
// heavy_orig.cfg's om_capview) and captures a burst of frames after every temp entity (om_fxshot), the
// harness pairs them with origA's captures (fxpairs.py). About 200 frames per second: w1k is about 5 s.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
w1k
w1k
w1k
omshot c_pre
+attack
w10
-attack
w100
// a second attack press stops chasing: a free spectator 35 units behind origA's eye (SPEC-780 s.17),
// in the PVS of the events, independent of origA's movements.
+attack
w10
-attack
w100
set om_fxview "-475 -928 110 24.5 180 0 1"
set om_fxshotdur 1500
set om_fxshotstep 60
set om_fxshotmax 60
set om_fxshot "*"
omshot c_00
echo OMTEST chasing
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
w1k
omshot c_99
echo OMTEST end
disconnect
w100
quit
