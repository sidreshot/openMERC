// Implements: SPEC-400 / SPEC-401 black-box session: the original client starts a deathmatch listen server with
// cheats (SPEC-780 `elbow` / `bigelbow` weapon kits, `heretic` god mode). run_session.ps1 -Listen puts ip, port
// and public 0 in front of these lines. The first player always spawns at info_player_deathmatch
// (-512 -928 24) angle 180 on dm/jpndm2 (SPEC-780 s.9: no living player, ties = first found): eye
// (-512 -928 59), looking along -x at the wall x = -912.
set deathmatch 1
set maxclients 4
set timelimit 0
set fraglimit 0
set cheats 1
map dm/jpndm2
