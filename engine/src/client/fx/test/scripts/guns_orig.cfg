// Implements: SPEC-400 / SPEC-401 black-box session "guns": sent to the original client (listen host, cheats on,
// cheat_start.cfg) once the OpenMerc spectator chases it. Takes the elbow kit and god mode, then fires each
// gun straight at the wall in front (x = -912). Both clients draw from the same fixed eye 41 units from the
// impact point with Ghoul, weapon and viewer models left out (om_capview here, om_fxview in guns_om.cfg).
// OMSHOT lines are captures through ref_omcap, about 700 frames per second: w1k is about 1.4 s.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
echo OMTEST origA script
record omguns
set om_capview "-872 -918 64 6.9 194 0 1"
elbow
heretic
w1k
echo OMSHOT g_00
// 9 mm (key 2, SPEC-601 slot order): two shots
weaponselect 2
w1k
w1k
+attack
w10
-attack
w100
echo OMSHOT p2a_1
w100
w100
w100
echo OMSHOT p2a_2
w1k
w1k
+attack
w10
-attack
w100
echo OMSHOT p2b_1
w100
w100
w100
echo OMSHOT p2b_2
w1k
w1k
// .44 (key 3)
weaponselect 3
w1k
w1k
+attack
w10
-attack
w100
echo OMSHOT p1a_1
w100
w100
w100
echo OMSHOT p1a_2
w1k
w1k
// shotgun (key 4)
weaponselect 4
w1k
w1k
+attack
w10
-attack
w100
echo OMSHOT sga_1
w100
w100
w100
echo OMSHOT sga_2
w1k
w1k
w1k
+attack
w10
-attack
w100
echo OMSHOT sgb_1
w100
w100
w100
echo OMSHOT sgb_2
w1k
w1k
// assault rifle (key 7): short burst
weaponselect 7
w1k
w1k
+attack
w100
-attack
w100
echo OMSHOT ara_1
w100
w100
w100
echo OMSHOT ara_2
w1k
w1k
// sniper rifle (key 5)
weaponselect 5
w1k
w1k
+attack
w10
-attack
w100
echo OMSHOT sna_1
w100
w100
w100
echo OMSHOT sna_2
w1k
w1k
// knife (key 1): throw (alternate attack)
weaponselect 1
w1k
w1k
+altattack
w10
-altattack
w100
w100
echo OMSHOT kna_1
w100
w100
w100
echo OMSHOT kna_2
w1k
w1k
echo OMSHOT g_99
echo OMTEST origA end
stop
w1k
w1k
w1k
quit
