// Implements: SPEC-400 / SPEC-401 black-box session (OpenMerc client on an original server)
// Run once in the level (cl_omexecactive): pistol and knife at the wall in front, captures, quit.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
w1k
echo OMTEST start
omshot s_0
weaponselect 2
w1k
echo OMTEST fire1
+attack
w10
-attack
w100
+attack
w10
-attack
w10
omshot s_1
w100
omshot s_2
w1k
echo OMTEST turn
+right
w100
-right
w100
+attack
w10
-attack
w10
omshot s_3
w100
+attack
w10
-attack
w100
omshot s_4
w1k
echo OMTEST down
+lookdown
w100
-lookdown
+attack
w10
-attack
w10
omshot s_5
w1k
omshot s_6
echo OMTEST end
disconnect
w100
quit
