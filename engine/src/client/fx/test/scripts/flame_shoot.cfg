// Implements: SPEC-400 black-box session "flame" (run_session.ps1 -OrigBScript beams_specB.cfg, -OmScript
// beams_om.cfg): sent to the original listen host origA (cheats on, cheat_start.cfg), which only shoots: holds the
// flame gun stream (svc_effect world/fthrower, sent to the other clients only), then one fireball. The original
// spectator origB and the OpenMerc spectator are compared. w1k is about 1.4 s on the host alone, longer with
// three clients.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
echo OMTEST origA script
bigelbow
heretic
w1k
weaponselect 11
w1k
w1k
echo OMTEST flame
+attack
w1k
w1k
-attack
w1k
w1k
+altattack
w10
-altattack
w1k
w1k
echo OMTEST origA end
w1k
w1k
w1k
w1k
w1k
w1k
quit
