// Implements: SPEC-400 / SPEC-401 black-box session helper: how long the original client needs to enter the
// level on the test desktop (captures every ~14 s, the original runs about 700 frames per second).
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
alias w10k "w1k;w1k;w1k;w1k;w1k;w1k;w1k;w1k;w1k;w1k"
echo OMSHOT l_0
w10k
echo OMSHOT l_1
w10k
echo OMSHOT l_2
w10k
echo OMSHOT l_3
w10k
echo OMSHOT l_4
w10k
echo OMSHOT l_5
w10k
echo OMSHOT l_6
quit
