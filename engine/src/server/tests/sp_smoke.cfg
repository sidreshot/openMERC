// Implements: SPEC-001 / SPEC-003 black-box single-player smoke session (sprun.ps1), run once in the level.
// OpenMerc captures with `omshot`, the original with `echo OMSHOT` (the harness) - each ignores the other.
// No semicolons in comments: the command buffer splits lines at them.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
echo OMTEST active
w1k
viewpos
omshot s0
echo OMSHOT s0
w1k
w1k
w1k
viewpos
omshot s1
echo OMSHOT s1
echo OMTEST forward
+forward
w1k
-forward
w1k
viewpos
omshot s2
echo OMSHOT s2
echo OMTEST turn
+right
w100
w100
-right
w1k
viewpos
omshot s3
echo OMSHOT s3
echo OMTEST fire
+attack
w100
-attack
w1k
w1k
viewpos
omshot s4
echo OMSHOT s4
echo OMTEST save
save i1btest
w1k
w1k
echo OMTEST load
load i1btest
w1k
w1k
w1k
viewpos
omshot s5
echo OMSHOT s5
w100
echo OMTEST quit
quit
