// Implements: SPEC-303 / SPEC-013 black-box session (sprun.ps1): save after the intro, load it, look, walk (does the loaded game run?), quit.
// No semicolons in comments: the command buffer splits lines at them.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
echo OMTEST active
w1k
w1k
w1k
w1k
viewpos
omshot l0
echo OMSHOT l0
echo OMTEST save
save i1bload
w1k
echo OMTEST load
load i1bload
w1k
w1k
w1k
viewpos
omshot l1
echo OMSHOT l1
echo OMTEST walk after load
+forward
w100
w100
w100
-forward
w1k
viewpos
omshot l2
echo OMSHOT l2
w100
echo OMTEST quit
quit
