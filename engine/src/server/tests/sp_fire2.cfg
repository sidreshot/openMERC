// Implements: SPEC-001 / SPEC-003 / SPEC-311 black-box session (sprun.ps1): as sp_fire.cfg with long presses: record a demo while
// firing the shotgun three times, half a second each (what the server sends for a shot), then quit.
// No semicolons in comments: the command buffer splits lines at them.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
echo OMTEST active
w1k
w1k
w1k
w1k
record i1bfire
w100
echo OMTEST fire1
+attack
w100
-attack
w1k
echo OMTEST fire2
+attack
w100
-attack
w1k
echo OMTEST fire3
+attack
w100
-attack
w1k
stop
w100
echo OMTEST quit
quit
