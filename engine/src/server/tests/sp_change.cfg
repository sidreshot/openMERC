// Implements: SPEC-001 / SPEC-303 black-box session (sprun.ps1 -Map kos1): fire once, then change level the way
// the game does (gamemap), stay in the new level, capture, quit.
// No semicolons in comments: the command buffer splits lines at them.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
echo OMTEST active
w1k
w1k
w1k
w1k
+attack
w10
-attack
w1k
viewpos
omshot c0
echo OMSHOT c0
echo OMTEST gamemap
gamemap kos2
w1k
w1k
w1k
w1k
viewpos
omshot c1
echo OMSHOT c1
w100
echo OMTEST quit
quit
