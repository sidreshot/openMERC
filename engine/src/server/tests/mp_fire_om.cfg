// Implements: SPEC-003 / SPEC-602 black-box session (svtest.py --client om --omexec): the OpenMerc client fires the
// starting weapon three times on a multiplayer server (button only, no predicted fire time), then disconnects.
// No semicolons in comments: the command buffer splits lines at them.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
w1k
w1k
+attack
w100
-attack
w1k
+attack
w100
-attack
w1k
+attack
w100
-attack
w1k
disconnect
