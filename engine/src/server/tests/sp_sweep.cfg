// Implements: SPEC-001 / SPEC-003 black-box map sweep (sprun.ps1 -Map <map>): stay in the level for a while
// (intro cinematics run), capture, walk a little, capture, quit.
// No semicolons in comments: the command buffer splits lines at them.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
echo OMTEST active
w1k
w1k
viewpos
omshot m0
echo OMSHOT m0
w1k
w1k
w1k
viewpos
omshot m1
echo OMSHOT m1
+forward
w100
w100
w100
-forward
w1k
viewpos
omshot m2
echo OMSHOT m2
w100
echo OMTEST quit
quit
