// Implements: SPEC-001 black-box session (sprun.ps1): no input at all. The OpenMerc client captures at server
// frames 100, 200 and 300 (cl_omshotframes, files f_<frame>), the original by time with
// -TimedShots "f_100@10,f_200@20,f_300@30" from its "Map:" line, so both pictures show the same moment of the
// level. The harness ends the run at its timeout.
set cl_omshotprefix f
set cl_omshotframes "100 200 300"
echo OMTEST idle
