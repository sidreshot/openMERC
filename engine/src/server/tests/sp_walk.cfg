// Implements: SPEC-001 / SPEC-003 black-box single-player session (sprun.ps1): short walks after the intro.
// No semicolons in comments: the command buffer splits lines at them.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
echo OMTEST active
w1k
w1k
w1k
w1k
viewpos
omshot w0
echo OMSHOT w0
echo OMTEST forward1
+forward
w10
w10
-forward
echo OMTEST forward1 done
w100
viewpos
echo OMTEST forward2
+forward
w100
-forward
echo OMTEST forward2 done
w100
viewpos
omshot w1
echo OMSHOT w1
echo OMTEST forward3
+forward
w1k
-forward
echo OMTEST forward3 done
w100
viewpos
omshot w2
echo OMSHOT w2
echo OMTEST quit
quit
