// Implements: SPEC-001 / SPEC-311 black-box single-player session (sprun.ps1): record a client demo of the
// level start without moving, then quit. Both engines write <user>/demos/i1bsp.dm2.
// No semicolons in comments: the command buffer splits lines at them.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
echo OMTEST active
w1k
record i1bsp
echo OMTEST recording
w1k
w1k
w1k
viewpos
omshot r0
echo OMSHOT r0
w1k
w1k
w1k
w1k
viewpos
omshot r1
echo OMSHOT r1
w1k
stop
echo OMTEST stopped
w100
quit
