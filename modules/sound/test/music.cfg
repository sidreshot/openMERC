// Implements: SPEC-004 (black-box test script for OMsnd)
// OMsnd music test (run with +set s_volume 0 so the capture holds music only):
// level music, then forcesong to another set (crossfade), then designer-mode changes via the level.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
set developer 1
set s_om_debug 1
map $omtest_map
w1k
w1k
w1k
w1k
echo OMTEST marker: forcesong ger1
forcesong ger1
w1k
w1k
w1k
w1k
echo OMTEST marker: s_musicvolume 0.35
set s_musicvolume 0.35
w1k
w1k
set s_musicvolume 0.7
echo OMTEST marker: quit
quit
