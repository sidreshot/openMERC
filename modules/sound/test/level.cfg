// Implements: SPEC-004 (black-box test script for OMsnd)
// OMsnd level session: load a single-player map, idle, fire, walk, volume and music probes, quit.
// Map: `+set omtest_map <name>` on the command line. Waits are frames (the game runs at ~300 fps
// here, so w1k is about 3 s). The log time stamps ([t=ms] from s_om_debug) give the real timeline.
// (No semicolons in comments: the command buffer splits lines at them before // is seen.)
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
set developer 1
set s_om_debug 7
map $omtest_map
w1k
w1k
w1k
w1k
soundinfo
s_show 1
w10
s_show 0
echo OMTEST marker: play menu/First
play menu/First
w1k
echo OMTEST marker: attack
+attack
w100
w100
-attack
w1k
echo OMTEST marker: walk
+forward
w1k
w1k
-forward
+right
w100
w100
-right
+forward
w1k
w1k
-forward
echo OMTEST marker: s_volume 0.2
set s_volume 0.2
w1k
echo OMTEST marker: s_volume 0.7
set s_volume 0.7
w1k
echo OMTEST marker: forcesong ger1
forcesong ger1
w1k
w1k
soundinfo
echo OMTEST marker: stopsound
stopsound
w1k
soundlist
echo OMTEST marker: quit
quit
