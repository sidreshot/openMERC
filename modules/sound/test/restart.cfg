// Implements: SPEC-004 (black-box test script for OMsnd)
// OMsnd restart test: snd_restart inside a level (re-registration), s_initsound 0, back on, quit.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
set developer 1
set s_om_debug 1
map $omtest_map
w1k
w1k
echo OMTEST marker: snd_restart 1
snd_restart
w1k
soundinfo
play menu/First
w100
echo OMTEST marker: s_initsound 0
set s_initsound 0
snd_restart
w1k
play menu/First
soundinfo
echo OMTEST marker: s_initsound 1
set s_initsound 1
snd_restart
w1k
soundinfo
echo OMTEST marker: quit
quit
