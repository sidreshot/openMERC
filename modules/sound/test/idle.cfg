// Implements: SPEC-004 (black-box test script for OMsnd)
// OMsnd idle probe: load a map, walk forward a little, report the shared state changes, quit.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
set developer 1
set s_om_debug 3
map $omtest_map
w1k
w1k
w1k
+forward
w1k
w1k
-forward
w1k
w1k
w1k
soundinfo
quit
