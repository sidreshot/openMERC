// Implements: SPEC-004 (black-box test script for OMsnd)
// OMsnd focus test (run with +set s_om_focusmute 1): S_Activate(0) -> silence, S_Activate(1) -> sound.
// minimise / vid_front only change activation of a window that has focus. A game started from a
// background process never gets focus, so post WM_ACTIVATE (0x0006, wParam 0 / 1) to its window instead.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
set developer 1
set s_om_debug 1
map $omtest_map
w1k
w1k
echo OMTEST marker: minimise
minimise
w1k
w1k
echo OMTEST marker: vid_front
vid_front
w1k
w1k
echo OMTEST marker: quit
quit
