// Implements: SPEC-AMEND-006 I1c.1 verify (OpenMerc listen server tsr1, run with +set vid_maxfps 10 +set cl_minfps 30):
// the game clock keeps pace with the svc_frame game time at 10 fps; freezeworld 1 stops it, freezeworld 0 makes it
// jump back to the frame time. Started once in the level (cl_omexecactive); om_after counts rendered frames.
set vid_maxfps 10
set cl_minfps 30
om_after 30 "om_entdump 1"
om_after 60 "om_entdump 1"
om_after 90 "om_entdump 1"
om_after 120 "om_entdump 1"
om_after 130 "freezeworld 1"
om_after 140 "om_entdump 1"
om_after 170 "om_entdump 1"
om_after 200 "om_entdump 1"
om_after 205 "freezeworld 0"
om_after 215 "om_entdump 1"
om_after 245 "om_entdump 1"
om_after 260 "quit"
