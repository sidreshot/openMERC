// Implements: SPEC-311, SPEC-310 13, SPEC-013 (I1c: OpenMerc client with Ghoul drawing records a demo on an original dedicated server)
// Started by the client itself once it is in the level (cl_omexecactive, run_omrec.ps1), so its waits
// do not hold back the server's commands. Same sequence as rec_orig.cfg; every omshot is a capture
// during a still period.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
crosshair 1
w1k
echo OMTEST record
record i1c3
w1k
omshot r_1
w100
echo OMTEST forward
+forward
w100
w100
w100
-forward
w1k
omshot r_2
w100
echo OMTEST turn
+right
w100
-right
w1k
omshot r_3
w100
echo OMTEST knife
weaponselect 1
w1k
omshot r_4
w100
echo OMTEST pistol
weaponselect 2
w1k
echo OMTEST fire
+attack
w10
-attack
w1k
omshot r_5
w100
echo OMTEST score
score
w1k
omshot r_6
w100
score
w1k
omshot r_7
w100
echo OMTEST stop
stop
w100
disconnect
w100
quit
