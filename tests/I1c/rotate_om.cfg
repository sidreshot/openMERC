// Implements: SPEC-AMEND-006 I1c.2 / I1c.7 verify (OpenMerc, orig1.dm2 at timescale 0.5, vid_maxfps 30): the
// dropped weapon (effects 0x2000) keeps pitch and roll as sent and spins 100 degrees per real second; props show
// pitch/roll negated and the yaw quantised; the own entity sits at the previous frame's view origin.
set cl_omdemoquit 1
set timescale 0.5
set vid_maxfps 30
om_after 150 "om_entdump 1"
om_after 180 "om_entdump 1"
om_after 240 "om_entdump 1"
demomap orig1
