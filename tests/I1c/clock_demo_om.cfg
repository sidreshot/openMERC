// Implements: SPEC-AMEND-006 I1c.1 verify on orig1.dm2 at 10 fps with cl_minfps 30: the clock keeps pace with the
// svc_frame game time; freezeworld 1 stops it, freezeworld 0 lets it jump back to the frame time.
set cl_omdemoquit 1
set vid_maxfps 10
set cl_minfps 30
om_after 60 "om_entdump 1"
om_after 90 "om_entdump 1"
om_after 120 "om_entdump 1"
om_after 150 "om_entdump 1"
om_after 151 "freezeworld 1"
om_after 160 "om_entdump 1"
om_after 180 "om_entdump 1"
om_after 181 "freezeworld 0"
om_after 182 "om_entdump 1"
om_after 184 "om_entdump 1"
om_after 200 "om_entdump 1"
demomap orig1
