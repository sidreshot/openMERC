// I2d: second lobby chat session against the scripted local IRC server (chattest.py fake --port 16668).
// The chat page stays open so the public log can be captured; developer 0 (normal console prints only).
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1s "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
alias w3s "w1s;w1s;w1s"
set developer 0
set gsc_server 127.0.0.1
set gsc_port 16668
set gsc_user omuser
set menu_room lobby
menu chat
w1s
echo OMTEST A-connect-errors
gsc_connect 127.0.0.1 16668 1abc
w1s
gsc_connect 127.0.0.1 16668 takenNick
w1s
gsc_connect 127.0.0.1 16668 errnickA
w1s
gsc_connect 127.0.0.1 16668 closenickA
w1s
gsc_connect 127.0.0.1 16669 OMorig
w1s
echo OMSHOT a_errors
w1s
echo OMTEST B-connects
gsc_connect 127.0.0.1 16668 OMorig
w1s
gsc_connect 127.0.0.1 16668 OMorig
w1s
gsc_disconnect
w1s
gsc_connect 127.0.0.1 16668 OMorig
w1s
echo OMSHOT b_connects
w1s
echo OMTEST C-joins
gsc_join lobby
w1s
gsc_join LOBBY
gsc_join sof
w1s
gsc_join full
w1s
gsc_join keyed wrong
w1s
gsc_join opchan
w1s
echo OMSHOT c_joins
w1s
menu_topic
echo OMTEST D-topics
gsc_gettopic opchan
gsc_gettopic notopic
w1s
menu_topic
gsc_gettopic sof
w1s
menu_topic
gsc_getusers sof
w1s
gsc_getusers nosuch
w1s
gsc_getusers opchan
w1s
echo OMSHOT d_topics
w1s
echo OMTEST E-ops
gsc_kick opchan bob "go away"
gsc_ban opchan voiceguy
gsc_ban opchan starhost
gsc_ban opchan nosuchnick
gsc_setusermode opchan bob op
gsc_setusermode opchan bob voice
gsc_setusermode opchan bob x
w1s
echo OMSHOT e_ops
w1s
echo OMTEST F-modes
gsc_join modes
w1s
echo OMSHOT f_modes
w1s
echo OMTEST G-reopen
menuoff
w1s
gsc_talk modes "while menu closed"
w1s
menu chat
w1s
echo OMSHOT g_reopen
w1s
echo OMTEST H-events
gsc_talk modes ev_msgs
w1s
echo OMSHOT h_msgs
w1s
gsc_talk modes ev_people
w1s
echo OMSHOT h_people
w1s
echo OMTEST I-own
set gsc_nick OMorig
gsc_talk modes "hello all"
gsc_talk modes "/me dances"
gsc_talk modes "/notice quiet notice"
gsc_private bob "hi bob"
gsc_private bob "/me pokes bob"
gsc_private bob "/notice psst"
gsc_talk modes ev_kickme
w1s
gsc_part modes
w1s
gsc_part modes
w1s
echo OMSHOT i_own
w1s
echo OMTEST J-errors
gsc_join sof
w1s
gsc_talk sof ev_error
w3s
echo OMSHOT j_error
w1s
gsc_connect 127.0.0.1 16668 OMorig2
w1s
gsc_talk lobby ev_close
w3s
echo OMSHOT j_close
w1s
echo OMTEST K-private
menuoff
menu private
w1s
gsc_connect 127.0.0.1 16668 OMorig3
w1s
gsc_private bob "private line"
gsc_private bob "/me private act"
gsc_private bob "/notice private note"
w1s
echo OMSHOT k_private
w1s
menuoff
quit
