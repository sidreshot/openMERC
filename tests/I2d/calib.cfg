// timing calibration: frames per second of `wait` in the engine under test
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
set gsc_server 127.0.0.1
set gsc_port 16668
set gsc_nick OMcalib
gsc_connect
w100
gsc_join lobby
w100
gsc_talk lobby "t100"
w100;w100;w100;w100;w100
gsc_talk lobby "t600"
w100
gsc_disconnect
w100
quit
