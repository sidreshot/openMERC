// I2d: OpenMerc with its default chat server, no relay. The home directory holds a config.cfg written by the
// original with its defaults (gsc_server "peerchat.gamespy.com"), a peer (chattest.py peer --nick OMpeerDef
// --channel openmerc-i2d --target OMmercI2d) waits in #openmerc-i2d on peerchat.openspy.net.
// Written for the original timing (1000 waits per second), run_om.ps1 adapts it.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1s "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
alias w3s "w1s;w1s;w1s"
alias w10s "w1s;w1s;w1s;w1s;w1s;w1s;w1s;w1s;w1s;w1s"
set developer 1
echo OMTEST cvars
gsc_server
gsc_port
gsc_nick
gsc_user
set gsc_nick OMmercI2d
set menu_room openmerc-i2d
menu chat
w1s
echo OMTEST connect
gsc_connect
w3s
gsc_join openmerc-i2d
w3s
gsc_talk openmerc-i2d "hello from OpenMerc"
gsc_talk openmerc-i2d "/me waves from OpenMerc"
gsc_talk openmerc-i2d "/notice an OpenMerc notice"
gsc_private OMpeerDef "a private hello from OpenMerc"
gsc_getusers openmerc-i2d
w10s
echo OMSHOT d1_chat
w1s
menuoff
echo OMTEST part
gsc_part openmerc-i2d
w3s
gsc_disconnect
w1s
quit
