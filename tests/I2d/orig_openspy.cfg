// I2d: the original client against OpenSpy's peerchat through the logging relay
// (chattest.py proxy --port 16667 --upstream peerchat.openspy.net:6667) with a peer (chattest.py peer --nick OMpeerI2d
// --channel openmerc-i2d --target OMorigI2d) in the channel.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1s "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
alias w3s "w1s;w1s;w1s"
alias w10s "w1s;w1s;w1s;w1s;w1s;w1s;w1s;w1s;w1s;w1s"
set developer 1
set gsc_server 127.0.0.1
set gsc_port 16667
set gsc_nick OMorigI2d
set gsc_user OMorigI2d
set menu_room openmerc-i2d
menu chat
w1s
echo OMTEST connect
gsc_connect
w3s
echo OMSHOT o1_connected
w1s
menu joinchat
w3s
echo OMSHOT o2_rooms
w1s
popmenu
w1s
echo OMSHOT o2b_after_pop
w1s
echo OMTEST join
gsc_join openmerc-i2d
w3s
gsc_talk openmerc-i2d "hello from the original client"
gsc_talk openmerc-i2d "/me waves"
gsc_talk openmerc-i2d "/notice a notice"
gsc_private OMpeerI2d "private hello"
gsc_gettopic openmerc-i2d
gsc_settopic openmerc-i2d "a topic"
gsc_ban openmerc-i2d OMpeerI2d
gsc_setusermode openmerc-i2d OMpeerI2d op
gsc_kick openmerc-i2d OMpeerI2d "test"
w10s
w10s
echo OMSHOT o3_peer
w1s
menu_topic
echo OMTEST NICK $gsc_nick
echo OMTEST part
gsc_part openmerc-i2d
w3s
gsc_disconnect
w1s
echo OMSHOT o4_end
w1s
quit
