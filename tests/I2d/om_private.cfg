// I2d: OpenMerc only (om_menukey delivers a mouse click through the engine's own menu input, the original has no
// console way to pick a user). chattest.py fake --port 16668. Picks "bob" in the users widget of the chat page
// (stock key command: menu private), then lets bob send private messages: they must go to the private log
// (SPEC-204 5.5), while the public log brackets them only when bob is not the selected user.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1s "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
set developer 1
set menu_room lobby
gsc_connect 127.0.0.1 16668 OMmerc omuser
w1s
gsc_join lobby
w1s
menu chat
w1s
echo OMSHOT p1_chat
w1s
echo OMTEST click-bob
om_menukey mouse1 60 190
w1s
echo OMTEST selected $menu_nick
echo OMSHOT p2_private_open
w1s
gsc_talk lobby ev_msgs
w1s
gsc_private bob "my answer"
w1s
echo OMSHOT p3_private_msgs
w1s
popmenu
w1s
echo OMSHOT p4_public_after
w1s
gsc_disconnect
w1s
quit
