// I2d: checks of SPEC-AMEND-006 I2d.1-I2d.8 against the scripted IRC server (chattest.py fake --port 16668).
// Written for the original (1 wait = 1 frame, about 1000 frames/s), run_om.ps1 adapts it for OpenMerc.
// Markers M10 ... M57 are seconds after the latelistA connect (I2d.4 rule 3 and I2d.5 time limits).
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1s "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
alias w3s "w1s;w1s;w1s"
alias w10s "w1s;w1s;w1s;w1s;w1s;w1s;w1s;w1s;w1s;w1s"
set developer 1
set gsc_user omuser
set menu_room lobby
menu chat
w1s
echo OMTEST A-errkeep
gsc_connect 127.0.0.1 16668 errkeepA omuser
w3s
gsc_join lobby
gsc_getchannels
gsc_talk lobby nothing
w1s
echo OMTEST A-reconnect
gsc_connect 127.0.0.1 16668 OMorig omuser
w1s
echo OMSHOT a_errkeep
w1s
echo OMTEST B-ctcp
gsc_join lobby
w1s
gsc_talk lobby ev_ctcp
w1s
echo OMSHOT b_ctcp
w1s
echo OMTEST C-other
gsc_talk lobby ev_other
w1s
menu_topic
gsc_gettopic other
w1s
menu_topic
echo OMSHOT c_other
w1s
echo OMTEST C-busy
gsc_join busy
w1s
echo OMSHOT c_busy
w1s
menu_topic
echo OMTEST F-lifetime
menuoff
w1s
gsc_talk busy ev_people
w1s
set menu_room slownames
menu chat
w1s
echo OMSHOT f_reopen
w1s
menu_topic
echo OMTEST DE-limits
gsc_connect 127.0.0.1 16668 latelistA omuser
w1s
gsc_getusers slownames
gsc_getusers nosuch
w10s
echo OMTEST M10
w10s
w10s
w3s
echo OMTEST M34
w10s
echo OMTEST M44
w10s
w3s
echo OMTEST M57
echo OMSHOT d_limits
w1s
gsc_disconnect
w1s
quit
