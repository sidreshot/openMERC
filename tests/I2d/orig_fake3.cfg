// I2d: third session against chattest.py fake --port 16668: channel-mode names (developer prints), chat log
// lifetime, 30 s limits of LIST, TOPIC, WHOIS.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1s "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
alias w3s "w1s;w1s;w1s"
alias w10s "w1s;w1s;w1s;w1s;w1s;w1s;w1s;w1s;w1s;w1s"
set developer 1
set gsc_server 127.0.0.1
set gsc_port 16668
set gsc_user omuser
set menu_room lobby
menu chat
w1s
gsc_connect 127.0.0.1 16668 OMorig
w1s
gsc_join modes
w1s
echo OMSHOT m1_log
w1s
echo OMTEST chat-reopened-while-open
menu chat
w1s
echo OMSHOT m2_chat_again
w1s
gsc_talk modes "line after reopen"
w1s
echo OMTEST menuoff-then-lines
menuoff
w1s
gsc_talk modes "while closed"
gsc_talk modes ev_msgs
w1s
menu chat
w1s
echo OMSHOT m3_after_menuoff
w1s
echo OMTEST timeouts
gsc_connect 127.0.0.1 16668 slowlistA
w1s
gsc_join lobby
w1s
gsc_gettopic slowtopic
gsc_ban lobby silentwhois
gsc_getchannels
w10s
w10s
w10s
w3s
w3s
menu_topic
echo OMSHOT m4_timeouts
w1s
gsc_disconnect
w1s
quit
