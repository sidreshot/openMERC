// I2d: channel-list requests that overlap or stay unanswered (chattest.py fake --port 16668).
// Written for the original (1 wait = 1 frame, about 1000 frames/s), run_om.ps1 adapts it for OpenMerc.
// (No semicolon in comments: the console splits the line there and runs the rest as a command.)
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1s "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
alias w3s "w1s;w1s;w1s"
alias w10s "w1s;w1s;w1s;w1s;w1s;w1s;w1s;w1s;w1s;w1s"
set developer 1
set gsc_user omuser
set menu_room lobby
gsc_connect 127.0.0.1 16668 OMorig omuser
w1s
menu joinchat
w1s
echo OMTEST two-lists-answered
gsc_getchannels
gsc_getchannels
w1s
echo OMSHOT l1_rooms
w1s
menuoff
echo OMTEST partial-list
gsc_connect 127.0.0.1 16668 partlistA omuser
w10s
w10s
w10s
w3s
echo OMTEST slow-lists-T0
gsc_connect 127.0.0.1 16668 slowlistB omuser
w10s
echo OMTEST T10
gsc_getchannels
w10s
w10s
w3s
echo OMTEST T33
w10s
echo OMTEST T43
menu joinchat
w1s
echo OMSHOT l2_rooms_after
w1s
gsc_disconnect
w1s
quit
