// I2d: lobby chat session against the scripted local IRC server (tools/net/chattest.py fake --port 16668)
// For the original SoF.exe (1 wait = 1 frame, about 1000 frames/s on the hidden desktop)
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1s "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
alias w3s "w1s;w1s;w1s"
alias w10s "w1s;w1s;w1s;w1s;w1s;w1s;w1s;w1s;w1s;w1s"
set developer 1
echo OMTEST usage-without-connection
gsc_part
gsc_getusers
gsc_settopic
gsc_settopic lobby
gsc_gettopic
gsc_kick
gsc_kick lobby bob
gsc_ban
gsc_ban lobby
gsc_setusermode
gsc_setusermode lobby bob
gsc_join
gsc_talk
gsc_private
gsc_disconnect
gsc_talk lobby nothing-sent
echo OMTEST invalid-nick
set gsc_server 127.0.0.1
set gsc_port 16668
set gsc_nick 1abc
set gsc_user omuser
gsc_connect
w1s
echo OMTEST nick-taken
gsc_connect 127.0.0.1 16668 takenNick
w1s
echo OMTEST error-before-welcome
gsc_connect 127.0.0.1 16668 errnickA
w1s
gsc_join lobby
w1s
echo OMTEST closed-before-welcome
gsc_connect 127.0.0.1 16668 closenickA
w1s
echo OMTEST connect-failure
gsc_connect 127.0.0.1 16669 OMorig
w3s
echo OMTEST main-session
gsc_connect 127.0.0.1 16668 OMorig omuser
w1s
set menu_room lobby
menu chat
w1s
echo OMSHOT s1_connected
menuoff
gsc_getchannels
w1s
menu joinchat
w1s
echo OMSHOT s2_rooms
menuoff
echo OMTEST join
gsc_join lobby
w1s
gsc_join LOBBY
gsc_getusers lobby
gsc_getusers sof
gsc_gettopic lobby
gsc_gettopic notopic
w1s
echo OMTEST TOPIC1 $menu_topic
gsc_gettopic sof
w1s
echo OMTEST TOPIC2 $menu_topic
gsc_getusers lobby
echo OMTEST talk
gsc_talk lobby "hello all"
gsc_talk lobby "/me dances"
gsc_talk lobby "/ME big dance"
gsc_talk lobby "/notice quiet notice"
gsc_talk lobby "/NOTICE loud notice"
gsc_talk lobby ""
gsc_talk lobby
gsc_talk lobby two words
gsc_private bob "hi bob"
gsc_private bob "/me pokes bob"
gsc_private bob "/notice psst"
gsc_settopic lobby "my new topic"
gsc_kick lobby bob "go away"
gsc_ban lobby bob
gsc_setusermode lobby bob op
gsc_setusermode lobby bob voice
gsc_setusermode lobby bob none
gsc_setusermode lobby bob OP
w1s
echo OMTEST TOPIC3 $menu_topic
menu chat
w1s
echo OMSHOT s3_talk
echo OMTEST events-msgs
gsc_talk lobby ev_msgs
w1s
echo OMSHOT s4_msgs
echo OMTEST events-people
gsc_talk lobby ev_people
w1s
echo OMSHOT s5_people
echo OMTEST NICK $gsc_nick TOPIC4 $menu_topic
menuoff
set gsc_nick OMorig
menu private
w1s
gsc_private bob "private line"
gsc_private bob "/me private act"
gsc_private bob "/notice private note"
gsc_talk lobby ev_msgs
w1s
echo OMSHOT s6_private
menuoff
echo OMTEST part-rejoin
gsc_part lobby
w1s
gsc_join lobby
w1s
gsc_part
gsc_join full
w1s
gsc_join keyed wrong
w1s
gsc_join keyed secret
w1s
gsc_talk keyed ev_kickme
w1s
gsc_join banned
w1s
menu chat
w1s
echo OMSHOT s7_joins
menuoff
echo OMTEST error-after-welcome
gsc_join sof
w1s
gsc_talk sof ev_error
w3s
gsc_talk sof after-error
menu chat
w1s
echo OMSHOT s8_error
menuoff
echo OMTEST close-after-welcome
gsc_connect 127.0.0.1 16668 OMorig2
w1s
gsc_join lobby
w1s
gsc_talk lobby ev_close
w3s
menu chat
w1s
echo OMSHOT s9_close
menuoff
echo OMTEST timeouts
gsc_connect 127.0.0.1 16668 OMorig3
w1s
gsc_join silent
w10s
w10s
w10s
w3s
echo OMTEST after-30s
gsc_join nomode
w10s
w10s
w10s
w3s
gsc_getusers slownames
w10s
w10s
w10s
w3s
menu chat
w1s
echo OMSHOT s10_timeouts
menuoff
echo OMTEST quit-while-connected
quit
