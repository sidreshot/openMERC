// Controlled render bench on maps/arm1. Three stands, six seconds each.
// lamp: shop light 600 216 24, camera 600 120 -40 looking north and up.
// mirror: armory/mirror face at 290 304 61, camera 290 220 40 looking north.
// hawk: m_x_mmerc hawk1 at 656 192 -40, camera 560 192 -40 looking east.
// r_om_prof_tag change prints OMSPOT for the stand just left (settle = first 30 frames).
// No semicolons in comments: the command buffer splits lines at them.
set cheats 1
set logfile 0
set cl_pitchdebug 0
set r_om_gputime 2
om_after r2 heretic
om_after r2 ninja
om_after r3 omsetpos 600 120 -40 90 -20
om_after r3 r_om_prof_tag lamp
om_after r9 omsetpos 290 220 40 90 0
om_after r9 r_om_prof_tag mirror
om_after r15 omsetpos 560 192 -40 0 0
om_after r15 r_om_prof_tag hawk
om_after r21 r_om_prof_tag end
om_after r22 quit
