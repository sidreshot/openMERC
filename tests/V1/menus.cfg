// V1: capture the main screens at the window size given on the command line (whole-frame omshot)
set menu_dc_reason "Test disconnect reason"
menu main
om_after 60 "omshot main"
om_after 70 "menuoff;menu video"
om_after 130 "omshot video"
om_after 140 "menuoff;menu load"
om_after 200 "omshot load"
om_after 210 "menuoff;menu save"
om_after 270 "omshot save"
om_after 280 "menuoff;menu options"
om_after 340 "omshot options"
om_after 350 "menuoff;menu keys"
om_after 410 "omshot keys"
om_after 420 "menuoff;menu quit"
om_after 480 "omshot quit"
om_after 490 "menuoff;menu loading"
om_after 550 "omshot loading"
om_after 560 "menuoff;toggleconsole"
om_after 620 "omshot console"
om_after 630 "echo V1MENUS done"
om_after 640 "quit"
