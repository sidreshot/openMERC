// V1: in-game captures through tests\X1\xrun.ps1 (same waits as x1_sweep.cfg): HUD with the weapon, after
// firing, the objectives page (TAB = "menu objectives"), the console, the death screen. About 40 s.
// No semicolons in comments: the command buffer splits lines at them.
// omshot captures at the end of the frame: a w10 follows every omshot before the next action.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
echo OMTEST active
w1k
w1k
w1k
omshot hud0
w10
w1k
w1k
+attack
w10
-attack
w100
w100
omshot hud1
w10
menu objectives
w100
w100
omshot objectives
w10
menuoff
w100
toggleconsole
w100
w100
omshot console
w10
toggleconsole
w100
echo OMTEST kill
kill
w1k
w1k
omshot death
w10
w1k
w1k
omshot death2
w10
w100
quit
