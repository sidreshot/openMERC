// V1 HUD scaling identity check: the same HUD captured with scr_hudscale 1 and 0 a few frames apart
// (at 640x480 both must be pixel-identical: f = 1), plus the RMF parse test with our page.
// No semicolons in comments: the command buffer splits lines at them.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
echo OMTEST active
w1k
w1k
w1k
w1k
w1k
w1k
set scr_hudscale 1
w10
omshot hs1
w10
set scr_hudscale 0
w10
omshot hs0
w10
om_rmftest
w1k
quit
