// V1 HUD scaling: HUD with the weapon, a centre print (om_centerprint), the objectives page, the console.
// No semicolons in comments: the command buffer splits lines at them. A w10 follows every omshot
// (captures happen at the end of the frame).
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
echo OMTEST active
w1k
w1k
w1k
w1k
w1k
+attack
w10
-attack
w100
w100
omshot hud
w10
om_centerprint Centre print test: HUD scale
w100
omshot cprint
w10
w1k
menu objectives
w100
w100
omshot objectives
w10
menuoff
w100
toggleconsole
w1k
omshot console
w10
toggleconsole
w100
quit
