// V1 verification 1: a plain start (no video arguments). This autoexec only drives the test:
// after the disclaimer -> intro -> main menu sequence (~30 s) it captures the main menu, prints the
// video state and quits, so config.cfg is written.
set logfile 3
om_after 5400 "om_menushot main"
om_after 5410 "echo V1STATE r_mode $r_mode vid_fullscreen $vid_fullscreen r_vsync $r_vsync vid_maxfps $vid_maxfps scr_aspect $scr_aspect fov $fov horplus $horplus vid_renderer $vid_renderer vid_gamma $vid_gamma r_anisotropic $r_anisotropic"
om_after 5420 "quit"
