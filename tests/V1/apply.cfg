// V1: the video page's Apply and Defaults flows (the key commands of the two buttons, run from the console)
menu video
om_after 60 "omshot video_before"
om_after 70 "echo V1BEFORE r_mode $r_mode menu_mode $menu_mode vid_fullscreen $vid_fullscreen menu_fullscreen $menu_fullscreen menu_maxfps $menu_maxfps menu_fov $menu_fov menu_anisotropic $menu_anisotropic"
om_after 80 "set menu_mode 14;set menu_fullscreen 0;set menu_maxfps 120;set menu_fov 100;set menu_settings_changed 1"
om_after 90 "menuoff;exec menus/applyvid.cfg;vid_restart;menu main;menu video"
om_after 220 "omshot video_applied"
om_after 230 "echo V1APPLY r_mode $r_mode menu_mode $menu_mode vid_fullscreen $vid_fullscreen vid_maxfps $vid_maxfps fov $fov"
om_after 240 "menuoff;exec default_video.cfg;vid_restart;menu main;menu video"
om_after 370 "omshot video_defaults"
om_after 380 "echo V1DEFAULTS r_mode $r_mode menu_mode $menu_mode vid_fullscreen $vid_fullscreen vid_maxfps $vid_maxfps fov $fov scr_aspect $scr_aspect"
om_after 390 "quit"
