// Implements: black-box level-change chain of the open stack (xrun.ps1 -Map tsr1 -Script x1_chain.cfg): in every
// level stay about 12 s, look, walk, fire once, capture, then change level the way the game does (gamemap) to the
// next map of the campaign order (changelevel targets of the stock maps, armouries between missions).
// The harness timeout ends the run. No semicolons in comments: the command buffer splits lines at them.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
alias stay "w1k;w1k;viewpos;+forward;w100;w100;-forward;+attack;w10;-attack;w1k"
echo OMTEST chain tsr1
stay
omshot c01_tsr1
echo OMTEST gamemap tsr2
gamemap tsr2
w1k
stay
omshot c02_tsr2
echo OMTEST gamemap trn1
gamemap trn1
w1k
stay
omshot c03_trn1
echo OMTEST gamemap arm1
gamemap arm1
w1k
stay
omshot c04_arm1
echo OMTEST gamemap kos1
gamemap kos1
w1k
stay
omshot c05_kos1
echo OMTEST gamemap kos2
gamemap kos2
w1k
stay
omshot c06_kos2
echo OMTEST gamemap kos3
gamemap kos3
w1k
stay
omshot c07_kos3
echo OMTEST gamemap sib1
gamemap sib1
w1k
stay
omshot c08_sib1
echo OMTEST gamemap sib2
gamemap sib2
w1k
stay
omshot c09_sib2
echo OMTEST gamemap sib3
gamemap sib3
w1k
stay
omshot c10_sib3
echo OMTEST gamemap irq1a
gamemap irq1a
w1k
stay
omshot c11_irq1a
echo OMTEST gamemap irq2a
gamemap irq2a
w1k
stay
omshot c12_irq2a
echo OMTEST gamemap irq3a
gamemap irq3a
w1k
stay
omshot c13_irq3a
echo OMTEST gamemap arm2
gamemap arm2
w1k
stay
omshot c14_arm2
echo OMTEST gamemap nyc1
gamemap nyc1
w1k
stay
omshot c15_nyc1
echo OMTEST gamemap nyc2
gamemap nyc2
w1k
stay
omshot c16_nyc2
echo OMTEST gamemap nyc3
gamemap nyc3
w1k
stay
omshot c17_nyc3
echo OMTEST gamemap sud1
gamemap sud1
w1k
stay
omshot c18_sud1
echo OMTEST gamemap sud2
gamemap sud2
w1k
stay
omshot c19_sud2
echo OMTEST gamemap sud3
gamemap sud3
w1k
stay
omshot c20_sud3
echo OMTEST gamemap arm3
gamemap arm3
w1k
stay
omshot c21_arm3
echo OMTEST gamemap jpn1
gamemap jpn1
w1k
stay
omshot c22_jpn1
echo OMTEST gamemap jpn2
gamemap jpn2
w1k
stay
omshot c23_jpn2
echo OMTEST gamemap jpn3
gamemap jpn3
w1k
stay
omshot c24_jpn3
echo OMTEST gamemap irq1b
gamemap irq1b
w1k
stay
omshot c25_irq1b
echo OMTEST gamemap irq2b
gamemap irq2b
w1k
stay
omshot c26_irq2b
echo OMTEST gamemap irq3b
gamemap irq3b
w1k
stay
omshot c27_irq3b
echo OMTEST gamemap ger1
gamemap ger1
w1k
stay
omshot c28_ger1
echo OMTEST gamemap ger2
gamemap ger2
w1k
stay
omshot c29_ger2
echo OMTEST gamemap ger3
gamemap ger3
w1k
stay
omshot c30_ger3
echo OMTEST gamemap ger4
gamemap ger4
w1k
stay
omshot c31_ger4
echo OMTEST chain end
w100
quit
