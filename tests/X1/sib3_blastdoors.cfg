// sib3_blastdoors: the blast doors of the first checkpoint (owner's report 2026-11-13, docs/DEVIATIONS.md "Door
// clearance"). The front door button (t360) runs checkpt1, which shuts the blast doors (blastdr1, blastdr2: start
// open, toggle); the checkpoint button (entity 49 in game numbering, target t362) runs checkpt2, which toggles them
// back open. Run:  openMerc +set cheats 1 +set sv_jumpcinematic 1 +map sib3 +exec sib3_blastdoors.cfg
// Expected (omboxents lines of blastdr1 ent 143 / blastdr2 ent 145): open at the start (state 1, blastdr1 lower half
// min z 340, blastdr2 min y -2272), shut 7 s after the front button (state 0, z 414, y -2362), open again 7 s after
// the checkpoint button (state 1, z 340, y -2272). Before the fix they stayed shut; om_doordebug 1 printed the door
// held by the cleansuit man near the world origin.
set cheats 1
set developer 1
set g6b_debug 1
set om_doordebug 1
set sv_jumpcinematic 1
alias s1 "echo OMTEST doors at start;heretic;ninja;omboxents 250 -2460 380 340 -2240 660"
alias s2 "echo OMTEST to the front button;omsetpos -26 -2888 470 0 -12"
alias s3 "omusetarget;+use"
alias s4 "-use"
alias s5 "echo OMTEST doors 7 s after the front button;omboxents 250 -2460 380 340 -2240 660"
alias s6 "echo OMTEST the checkpoint button;omsetpos -40 -2136 470 180 47"
alias s7 "omuse 49"
alias s9 "echo OMTEST doors 7 s after the checkpoint button;omboxents 250 -2460 380 340 -2240 660;omboxents -120 -2900 400 0 -2780 560"
alias s11 "echo OMTEST end;quit"
alias sgo "om_after r1 s1;om_after r2 s2;om_after r2.6 s3;om_after r2.9 s4;om_after r10 s5;om_after r11 s6;om_after r11.6 s7;om_after r19 s9;om_after r20 s11"
om_after r3 sgo
