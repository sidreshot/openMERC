// weapswap: weapon swap in the Crysis 2 manner (game g_weapswap.cpp, HUD cl_hud.c HUD_DrawSwap).
// Run on a single-player map at the default difficulty (carry limit 7; the skill presets 0-4 force sk_maxencum):
//   openMerc +set cheats 1 +set sv_jumpcinematic 1 +map tsr1 +exec weapswap.cfg
// The steps run at game times from the moment the player is in the game (om_after r<seconds>); "wait" does not pace
// a script here, and om_after t<seconds> counts from the server's start, which tsr1 has passed by then.
// Expected in the log (OMTEST lines, ominv) and the shots in user/scrnshot:
//   tsr1 starts with the knife (1), the 9 mm pistol (3, weight 1) and the shotgun (8, weight 2) in hand; the HK53
//   (5) and the sniper rifle (6, weight 2 each) laid at the feet are picked up by touch: weight 7 = the limit;
//   the machine gun (9, weight 2) laid ahead is not picked up and is offered (sw0_offer: its name and
//   "Hold <key>: replace <the weapon in hand>"; omswap lists why each weapon item is offered or not);
//   while +use is held the bar fills (sw1_hold); then the weapon that was in hand lies on the ground and the machine
//   gun is owned and in hand (ominv "weapon 9"; sw2_after);
//   with +use still held, the Ingram (4, weight 2) laid ahead is offered but not taken (sw3_held_on: one swap per
//   press); released and pressed again, it replaces the machine gun (ominv "weapon 4", sw4_second);
//   the rocket launcher (10, weight 3) laid ahead never fits by one swap at weight 7 (the others weigh 2 at most):
//   "Too heavy to carry" (omswap "possible 0 other 0", sw5_tooheavy);
//   with the 9 mm pistol (3, weight 1; weaponselect 2 = slot 1) in hand and the slug thrower (7, weight 2) laid at
//   the feet, a weight-2 weapon in hand would make room: "No room: hold a heavier weapon" (omswap "possible 0
//   other 1", sw6_heavier), and +use held for a second does nothing.
set cheats 1
set developer 1
set sv_jumpcinematic 1
alias wsw1 "echo OMTEST start;heretic"
alias wsw2 "ninja"
alias wsw3 "ominv"
alias wsw4 "gimme item_weapon_assault_rifle 0"
alias wsw5 "gimme item_weapon_sniper_rifle 0"
alias wsw6 "echo OMTEST after the fill;ominv"
alias wsw7 "gimme item_weapon_machinegun 70"
alias wsw8 "echo OMTEST offer;ominv;omswap;omshot sw0_offer"
alias wsw9 "+use"
alias wsw10 "omshot sw1_hold"
alias wsw11 "echo OMTEST after the swap, use still held;ominv;omswap;omshot sw2_after"
alias wsw12 "gimme item_weapon_machinepistol 60"
alias wsw13 "echo OMTEST use held on, a new offer;ominv;omswap;omshot sw3_held_on"
alias wsw14 "-use"
alias wsw15 "+use"
alias wsw16 "-use"
alias wsw17 "echo OMTEST second press;ominv;omswap;omshot sw4_second"
alias wsw18 "gimme item_weapon_rocketlauncher 60"
alias wsw19 "echo OMTEST too heavy;ominv;omswap;omshot sw5_tooheavy"
alias wsw20 "weaponselect 2"
alias wsw21 "gimme item_weapon_autoshotgun 35"
alias wsw22 "echo OMTEST heavier;ominv;omswap;omshot sw6_heavier;+use"
alias wsw23 "-use;echo OMTEST end;ominv"
alias wswgo "om_after r0.5 wsw1;om_after r1 wsw2;om_after r1.5 wsw3;om_after r2 wsw4;om_after r3 wsw5;om_after r4 wsw6;om_after r4.5 wsw7;om_after r6.5 wsw8;om_after r7 wsw9;om_after r7.3 wsw10;om_after r9 wsw11;om_after r9.5 wsw12;om_after r11.5 wsw13;om_after r12 wsw14;om_after r12.5 wsw15;om_after r14 wsw16;om_after r14.5 wsw17;om_after r15 wsw18;om_after r16.5 wsw19;om_after r18.5 wsw20;om_after r19 wsw21;om_after r20.5 wsw22;om_after r22 wsw23;om_after r23 quit"
om_after r3 wswgo
