// End-of-mission acc screen. It used to open the main menu. It must load menu_nextmap.
echo OM32 start
set developer 1
set logfile 2
set sv_jumpcinematic 2
set skill 1
set cheats 1
map kos1
om_after r2 set menu_nextmap sib1
om_after r2.4 intermission acc
om_after r8 echo OM32 check
om_after r8 status
om_after r8.6 quit
