// kos3 ending still says "intermission acc". That name opens the briefing (mail),
// not the old black page. Next on the briefing runs menus/outfit, Deploy loads menu_nextmap.
echo OM32 start
set developer 1
set logfile 2
set sv_jumpcinematic 2
set skill 1
set cheats 1
set menu_mail_available 1
set menu_mail_file maps/mail_sib1
set menu_nextmap sib1
map kos1
om_after r2 intermission acc
om_after r3 echo OM32 briefing
om_after r3 exec menus/outfit
om_after r3.2 menu outfit
om_after r4 echo OM32 deploy
om_after r4 loading
om_after r4.2 gamemap $menu_nextmap
om_after r8 echo OM32 check
om_after r8 status
om_after r8.4 quit
