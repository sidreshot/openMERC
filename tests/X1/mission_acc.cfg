// Issue 32: the kos3 quicksave (user/save/i32q2.sof, not in git) is mid-ending.
// Loading it runs the map script through to "intermission acc", which opens the
// briefing. Next runs menus/outfit. Deploy loads menu_nextmap (sib1).
echo OM32 start
set developer 1
set logfile 2
set sv_jumpcinematic 2
load i32q2
om_after c7 echo OM32 briefing
om_after c7 exec menus/outfit
om_after c7.3 menu outfit
om_after c8 echo OM32 deploy
om_after c8 "echo OM32 nextmap $menu_nextmap"
om_after c8.3 "gamemap $menu_nextmap;om_after 500 echo OM32 check;om_after 500 status;om_after 530 quit"
