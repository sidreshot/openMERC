// Implements: mode-B in-game menu audit (MODEB-GAPS.md): HUD captures, then every main in-game menu page opened
// over a running kos1 and written with om_menushot, then a console save. Run with xrun.ps1 -Map kos1.
// No semicolons in comments: the command buffer splits lines at them.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
echo OMTEST intro
w1k
w1k
w1k
w1k
w1k
omshot hud0
echo OMTEST inventory
itemnext
w100
omshot hud1
+attack
w10
-attack
w100
omshot hud2
menuoff
echo OMTEST menu main
menu main
w100
w100
om_menushot main
w100
menuoff
echo OMTEST menu game
menu game
w100
w100
om_menushot game
w100
menuoff
echo OMTEST menu save
menu save
w100
w100
om_menushot save
w100
menuoff
echo OMTEST menu load
menu load
w100
w100
om_menushot load
w100
menuoff
echo OMTEST menu video
menu video
w100
w100
om_menushot video
w100
menuoff
echo OMTEST menu audio
menu audio
w100
w100
om_menushot audio
w100
menuoff
echo OMTEST menu keys
menu keys
w100
w100
om_menushot keys
w100
menuoff
echo OMTEST menu options
menu options
w100
w100
om_menushot options
w100
menuoff
echo OMTEST menu misc
menu misc
w100
w100
om_menushot misc
w100
menuoff
echo OMTEST menu player
menu player
w100
w100
om_menushot player
w100
menuoff
echo OMTEST menu stats
menu stats
w100
w100
om_menushot stats
w100
menuoff
echo OMTEST menu quit
menu quit
w100
w100
om_menushot quit
w100
menuoff
w100
echo OMTEST save via cmd
save menu1
w1k
echo OMTEST quit
quit
