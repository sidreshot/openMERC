// X1 keyboard text test (xtype.ps1): console and chat typing with Cyrillic, VK_PACKET, captures.
// The console is opened and closed with the console key (step 0 / 4), as a player does.
set developer 0
set sv_jumpcinematic 1
echo OMTEST type start
om_after 600 "echo OMTYPE 0"
om_after 700 "echo OMTYPE 1"
om_after 860 "echo OMTYPE 2"
om_after 1100 "omshot cyr_console"
om_after 1160 "echo OMTYPE 3"
om_after 1260 "omshot cyr_console_sent"
om_after 1300 "echo OMTYPE 4"
om_after 1380 "messagemode"
om_after 1440 "echo OMTYPE 5"
om_after 1640 "omshot cyr_chat"
om_after 1700 "echo OMTYPE 6"
om_after 1800 "omshot cyr_chat_sent"
om_after 1840 "condump cyr_condump"
om_after 1870 "echo OMTEST done"
om_after 1900 "quit"
