// Implements: black-box map sweep of the open stack (tests/X1/xsweep.ps1, xrun.ps1 -Map <map>): stay in the level
// (intro cinematics, captions), capture, capture again, walk, fire three times, capture, quit. About 40 s.
// No semicolons in comments: the command buffer splits lines at them.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
echo OMTEST active
w1k
w1k
viewpos
omshot m0
w1k
w1k
w1k
viewpos
omshot m1
echo OMTEST walk
+forward
w100
w100
w100
-forward
echo OMTEST fire
+attack
w10
-attack
w100
w100
+attack
w10
-attack
w100
w100
+attack
w10
-attack
w1k
viewpos
omshot m2
w100
echo OMTEST quit
quit
