// Implements: black-box session for om_autorecord (xrun.ps1 -Map kos1 -Script x1_autorec.cfg
// -Config "set om_autorecord 1","set s_om_debug 24","set busywait 0"):
// stand, walk, turn, jump, save, load, change level, stand, quit. Every level start/load must leave
// a demos/auto/<date>_<time>_<map>.dm2 with a .jsonl next to it (checked by demo_analyze.py).
// No semicolons in comments: the command buffer splits lines at them.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
alias walk "+forward;w100;w100;w100;-forward;w100"
echo OMTEST active
w1k
w1k
echo OMTEST stand
w1k
w1k
echo OMTEST walk
walk
+left
w100
-left
walk
+moveup
w10
-moveup
w100
+back
w100
w100
-back
echo OMTEST save
save x1rec
w1k
walk
echo OMTEST load
load x1rec
w1k
w1k
walk
echo OMTEST level change
gamemap kos2
w1k
w1k
w1k
walk
w1k
echo OMTEST quit
w100
quit
