// Implements: black-box mode-B audit deathmatch session (tests/X1/xaudit.ps1, listen server with deathmatch N,
// bot_fillserv 1): wait for the bots, walk, fire, alt fire, scores, captures, quit.
// No semicolons in comments: the command buffer splits lines at them.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
alias shoot "+attack;w10;-attack;w100"
alias alt "+altattack;w10;-altattack;w100"
echo OMTEST active
w1k
w1k
viewpos
omshot d0
players
echo OMTEST walk
+forward
w100
w100
w100
-forward
shoot
shoot
alt
w1k
w1k
omshot d1
echo OMTEST scores
players
score
w100
omshot d2
-score
w1k
w1k
w1k
w1k
players
viewpos
omshot d3
echo OMTEST quit
w100
quit
