// Implements: black-box timed autosave play session (xrun.ps1 -Map tsr1 or kos1 -Script x1_autosave.cfg -Timeout 260):
// om_autosave_interval 1, walk forward and back and turn (about in place: walking off on kos1 ends the session)`n// for about 200 s (no fire, so every minute is a quiet moment), so three
// autosaves (the third rotates back to autotime1). om_autosave_debug 1 prints slot, position, write and thumbnail
// milliseconds of every autosave. savesleft before and after: an autosave must not spend the manual saves of the
// skill. Loading the slots back: x1_autosave_load.cfg.
// Run with xrun -Extra '+set cheats 1': notarget and god keep the enemies of kos1 from ending the session.
// No semicolons in comments: the command buffer splits lines at them.
set developer 1
set om_autosave_debug 1
set om_autosave_interval 1
echo OMTEST active
notarget
god
alias cyc "+forward;om_delay 2 -forward;om_delay 2.3 +back;om_delay 4.3 -back;om_delay 4.6 +left;om_delay 5.1 -left;om_delay 6 cyc"
cyc
om_delay 20 savesleft
om_delay 205 alias cyc echo OMTEST loop stopped
om_delay 214 viewpos
om_delay 215 savesleft
om_delay 216 om_savecheck autotime1
om_delay 217 om_savecheck autotime2
om_delay 219 echo OMTEST quit
om_delay 220 quit
