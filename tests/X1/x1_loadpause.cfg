// Implements: regression check t91u-6 (run by tests/X1/loadpause.ps1 with xrun -Map kos1)
// No semicolons in comments: the command buffer splits lines at them.
// Load and New Game from the in-game menu must end unpaused with the menus closed.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
w1k
w1k
om_keyevent ESCAPE
w1k
save lp_t91
w1k
menu main
w100
disconnect;menuoff;load lp_t91
w1k
w1k
om_menuprobe LP_AFTER_LOAD
menu main
w100
freshgame
w100
newgame
w1k
w1k
om_menuprobe LP_AFTER_NEWGAME
w100
quit