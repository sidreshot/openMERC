// Implements: black-box timed autosave load-back (xrun.ps1 -Map tsr1 or kos1 -Script x1_autosave_load.cfg -Timeout 200):
// om_autosave_interval 0.5 (30 s, the menu offers whole minutes) so that three autosaves (the third rotates back
// to autotime1) and both loads happen in about two minutes. The player stands still (a quiet moment), walks away
// after the third autosave, then loads autotime1 and autotime2, each followed by viewpos, paused, a screenshot and
// a walk. developer 0 before the loads: with developer 1 the loading menu is skipped and a load stays paused.
// Run with xrun -Extra '+set cheats 1': notarget and god keep the enemies of kos1 from ending the session.
// No semicolons in comments: the command buffer splits lines at them.
set developer 1
set om_autosave_debug 1
set om_autosave_interval 0.5
echo OMTEST active
notarget
god
om_delay 20 savesleft
om_delay 106 viewpos
om_delay 107 +forward
om_delay 108 -forward
om_delay 109 viewpos
om_delay 109.5 savesleft
om_delay 110 om_savecheck autotime1
om_delay 110.5 om_savecheck autotime2
om_delay 111 set developer 0
om_delay 111.5 echo OMTEST load autotime1
om_delay 112 load autotime1
om_delay 124 viewpos
om_delay 124.5 paused
om_delay 125 omshot as_load1
om_delay 126 +forward
om_delay 127 -forward
om_delay 128 viewpos
om_delay 129 echo OMTEST load autotime2
om_delay 130 load autotime2
om_delay 142 viewpos
om_delay 142.5 paused
om_delay 143 omshot as_load2
om_delay 144 +forward
om_delay 145 -forward
om_delay 146 viewpos
om_delay 147 savesleft
om_delay 148 echo OMTEST quit
om_delay 149 quit
