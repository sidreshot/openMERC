// kos1 sewer: stand at the valve lip, press use, the pipe brushes must leave their spawn.
// The use-key trigger sits below the eyes. fallinggrate must stay where it spawned.
echo OMPIPE6 start
set developer 1
set g6b_debug 1
set logfile 2
set sv_jumpcinematic 2
set skill 1
set cheats 1
map kos1
om_after r2 heretic
om_after r2 ninja
om_after r3 echo OMPIPE6 stand
om_after r3 omsetpos -1528 -1100 -40 270 40
om_after r3.6 echo OMPIPE6 before
om_after r3.6 omboxents -2000 -1200 -80 -1200 -800 80
om_after r3.6 omboxents -900 -1000 0 -600 -700 200
om_after r4.2 echo OMPIPE6 use
om_after r4.2 +use
om_after r4.6 -use
om_after r9 echo OMPIPE6 after
om_after r9 omboxents -2200 -1400 -500 -1000 -700 200
om_after r9 omboxents -900 -1000 -50 -600 -700 200
om_after r9.6 echo OMPIPE6 stop
om_after r9.8 quit
