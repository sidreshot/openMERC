// Implements: black-box save/load session of the open stack (xrun.ps1 -Map tsr1 -Script x1_save.cfg):
// (1) save mid-level, walk away, load it, check the loaded game runs (walk, fire)
// (2) change level (gamemap tsr2: the automatic save is written), save there, walk, load it, check
// (3) load the automatic save (auto), check. viewpos lines and captures after every step.
// No semicolons in comments: the command buffer splits lines at them.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
alias walk "+forward;w100;w100;w100;-forward;w100"
echo OMTEST active
w1k
w1k
w1k
w1k
viewpos
omshot s0_before
echo OMTEST save mid
save x1mid
w1k
walk
viewpos
omshot s1_walked
echo OMTEST load mid
load x1mid
w1k
w1k
viewpos
omshot s2_loaded
echo OMTEST walk after load
walk
+attack
w10
-attack
w1k
viewpos
omshot s3_after
echo OMTEST gamemap tsr2
gamemap tsr2
w1k
w1k
w1k
viewpos
omshot s4_tsr2
echo OMTEST save after change
save x1chg
w1k
walk
viewpos
echo OMTEST load after change
load x1chg
w1k
w1k
viewpos
omshot s5_loaded2
walk
+attack
w10
-attack
w1k
viewpos
omshot s6_after2
echo OMTEST load auto
load auto
w1k
w1k
viewpos
omshot s7_auto
walk
+attack
w10
-attack
w1k
viewpos
omshot s8_after3
echo OMTEST quit
w100
quit
