// Implements: black-box mode-B audit session (tests/X1/xaudit.ps1): intro, entity census, walk/strafe/jump/crouch,
// primary and alternate fire, reload, every weapon of both cheat kits (fire + alt fire each), a spawned enemy next
// to the player (AI encounter, player in god mode), kill all monsters (deaths, gore), save / walk away / load, quit.
// Needs +set cheats 1. No semicolons in comments: the command buffer splits lines at them.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
