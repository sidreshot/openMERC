// Implements: X1 screenshots in game (run with xrun.ps1 -Map kos1): view, console, in-game menu
// No semicolons in comments: the command buffer splits lines at them.
// The kos1 intro cinematic is skipped with Escape. Each capture waits about
// 1000 frames: the console slides in and the menus fade in.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
w1k
w1k
w1k
om_keyevent ESCAPE
w1k
w1k
om_menuprobe game
omshot s_game
w1k
toggleconsole
w1k
omshot s_console
w100
toggleconsole
w1k
menu main
w1k
om_menuprobe menu
omshot s_gamemenu
w1k
quit