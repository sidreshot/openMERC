// Implements: black-box check of the mission statistics (SPEC-AMEND-007 G18.41, SPEC-AMEND-014 R14.5):
// play a minute, getgamestats, kill every character, save once, getgamestats, then the end-of-mission
// command updateinvfinal with a stat_moneyadd bonus, and getgamestats again. Values are echoed to the log.
// No semicolons in comments: the command buffer splits lines at them.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
alias shows "stat_guyskilled;stat_friendlieskilled;stat_throatshots;stat_nutshots;stat_headshots;stat_gibs;stat_savesused;stat_cashearned;stat_playedtime;stat_playedtime_base"
echo OMTEST active
w1k
w1k
w1k
echo OMTEST stats1
getgamestats
w10
shows
echo OMTEST kill
killallmonsters
w1k
echo OMTEST save
save x1stat
w1k
echo OMTEST stats2
getgamestats
w10
shows
omshot st0
echo OMTEST final
set stat_moneyadd 1000
updateinvfinal
w100
shows
stat_moneyadd
echo OMTEST stats3
getgamestats
w10
shows
echo OMTEST quit
w100
quit