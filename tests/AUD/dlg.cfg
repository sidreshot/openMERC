// Implements: black-box sound test (tests/AUD/xaudio.ps1): stay in the level through the intro dialogue, walk,
// fire, keep listening. The harness kills the run at its timeout, so the length does not depend on the frame rate.
// No semicolons in comments: the command buffer splits lines at them.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
echo OMTEST active
soundinfo
w1k
w1k
w1k
soundinfo
