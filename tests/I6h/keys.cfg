// Implements: SPEC-312 (test vectors 6, 8; config compatibility), SPEC-310 (test vectors 6, 7)
// Input / binding / client-command checks, run in OpenMerc and in the original with the same script.
// origcfg.cfg = the oracle's user\config.cfg (written by the original 1.07f).
echo OMTEST begin
exec origcfg.cfg
echo OMTEST after-config
bindlist
echo OMTEST unbind
bind x "echo hi"
unbind x
bind x
bind X
echo OMTEST bad-names
bind ~ "echo tilde"
bind ; "echo semi"
bind KEYPAD_ENTER "echo nope"
echo OMTEST names
bind kp_fslash "echo kp"
bind KP_FSLASH
bind `
bind \
bind '
bind mouse1dbl "echo dbl"
bind MOUSE1DBL
bind aux32
echo OMTEST faves
addfave 1.2.3.4
addfave 1.2.3.4
remfave 1.2.3.4
remfave 1.2.3.4
addfave
echo OMTEST ignore
ignore
listignore
ignore 40
echo OMTEST ff
ff_tension 2
ff_tension 9
ff_spring 5000
ff_spring
echo OMTEST crosshair
crosshair 7
crosshair
echo OMTEST cvars
m_sensitivity_x 3.7
m_sensitivity_x
m_doublespeed
win_noaltenter
echo OMTEST end
quit
