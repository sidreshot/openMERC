// Implements: SPEC-312 section 4 rules and test vectors 5, 10 (OpenMerc only: cl_omkey feeds key events
// through the engine's key code without operating-system input). Run disconnected, console allowed.
echo OMTEST start
cl_omkey
echo OMTEST console-key-us
sp_language 0
cl_omkey 192 1
cl_omkey 192 0
cl_omkey
echo OMTEST typing
cl_omkey 69 1
cl_omkey 69 0
cl_omkey 67 1
cl_omkey 67 0
cl_omkey 72 1
cl_omkey 72 0
cl_omkey 79 1
cl_omkey 79 0
cl_omkey 32 1
cl_omkey 32 0
cl_omkey 16 1
cl_omkey 90 1
cl_omkey 90 0
cl_omkey 16 0
cl_omkey 103 1 1
cl_omkey 103 0 1
cl_omkey 36 1 0
cl_omkey 36 0 0
cl_omkey
cl_omkey 13 1
cl_omkey 13 0
echo OMTEST repeat
bind F6 "echo repeat-F6"
cl_omkey 117 1
cl_omkey 117 1
cl_omkey 117 0
cl_omkey 117 1
cl_omkey 117 0
echo OMTEST wheel-in-console
bind MWHEELUP "echo wheel-up"
cl_omkey 25 1
cl_omkey 25 0
echo OMTEST shift-grave-us
cl_omkey 16 1
cl_omkey 192 1
cl_omkey 192 0
cl_omkey 16 0
cl_omkey
echo OMTEST console-key-german
sp_language 1
cl_omkey 192 1
cl_omkey 192 0
cl_omkey
cl_omkey 220 1
cl_omkey 220 0
cl_omkey
sp_language 0
echo OMTEST escape
cl_omkey 27 1
cl_omkey 27 0
cl_omkey
echo OMTEST script-end
// queued bindings run after the rest of the script, so the end comes through a binding too
bind F12 "echo OMTEST appended-end;cl_omkey;quit"
cl_omkey 123 1
