// Implements: SPEC-311, SPEC-310 (black-box session: record a client demo on an original dedicated server)
// Sent to the joined client with the out-of-band cmd packet (run_orig.ps1 -Connect). Waits are frames
// (about 700 per second in game on this PC), so w1k is about 1.4 s. Every OMSHOT line is a capture during
// a still period (no key held for at least 2000 frames). cl_showlocation logs the player position at the
// start of each still period and is switched off 1000 frames before the capture (it prints on screen).
// No semicolons in comments: the command buffer splits lines at them.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
crosshair 1
cl_showlocation 1
w1k
w1k
w1k
echo OMTEST record
record orig1
