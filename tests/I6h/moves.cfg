// Implements: SPEC-312 test vectors 1-3 (user command fields), checked in a capture with movecheck.py.
// Started by the client once it is in the level (cl_omexecactive). Buttons typed in a script hold no
// key, so bit 0x80 (any key held) stays clear here.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
w100
w100
echo OMTEST forward
+forward
w100
-forward
w100
echo OMTEST diagonal
+forward
+moveright
w100
-moveright
-forward
w100
echo OMTEST diagonal-run
cl_run 1
+forward
+moveright
w100
-moveright
-forward
w100
echo OMTEST run-speed
+speed
+forward
w100
-forward
-speed
cl_run 0
w100
echo OMTEST use-lean
+use
+moveright
w100
-moveright
-use
w100
echo OMTEST lean-both
+leanright
+leanleft
w100
-leanleft
-leanright
w100
echo OMTEST attack
+attack
w10
-attack
w100
echo OMTEST end
disconnect
w10
quit
