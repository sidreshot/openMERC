// Implements: SPEC-600 / SPEC-003 (I1d session helpers, after I7's player/test/scripts/common.cfg).
// Single player on a deathmatch map (no intro cinematic). The prelude i1dpre.cfg of run.ps1 sets fixedtime per
// engine (25 ms original, 25000 us OpenMerc). No semicolons in comments: the command buffer splits lines at them.
unbindall
alias d1 "wait;wait;wait;wait;wait;wait;wait;wait"
alias d5 "d1;d1;d1;d1;d1"
alias s1 "d5;d5"
alias s2 "s1;s1"
alias s5 "s2;s2;s1"
set deathmatch 0
set maxclients 1
set bestweap safe
map dm/nycdm4
s2
heretic
ninja
