// Implements: SPEC-600 / SPEC-400 (I1d: the shotgun in single player - draw, three shots, shell-by-shell reload,
// dry fire; view-weapon notes `sound` / `effect` and the muzzle effect's fire sound)
exec i1d_common.cfg
echo OMTEST marker elbow
elbow
s2
echo OMTEST marker draw
weaponselect 4
s2
echo OMTEST marker fire3
+attack
wait
wait
wait
shot_1
wait
wait
shot_2
wait
wait
wait
-attack
s1
+attack
d1
-attack
s1
+attack
d1
-attack
s2
echo OMTEST marker reload
reload
s5
echo OMTEST marker empty
+attack
s5
s2
-attack
s2
echo OMTEST marker quit
quit
