// Implements: SPEC-600 / SPEC-400 / SPEC-311 (I1d: pistol shots and reload in single player, recorded as the
// client demo i1dpistol.dm2 for tests/I1d/vwstates.py)
exec i1d_common.cfg
record i1dpistol
echo OMTEST marker elbow
elbow
s2
echo OMTEST marker fire1
+attack
d1
-attack
s1
echo OMTEST marker fire2
+attack
d1
-attack
s2
echo OMTEST marker reload
reload
s2
s2
stop
echo OMTEST marker quit
quit
