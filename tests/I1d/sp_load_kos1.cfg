// Implements: SPEC-303 / SPEC-013 (I1d goal 3, after I1b's engine/src/server/tests/sp_load.cfg): kos1, save after the
// intro, load it, look around - the client must print no "Missing Child" (SPEC-013 client rule 5) after the load.
// No semicolons in comments: the command buffer splits lines at them.
unbindall
alias d1 "wait;wait;wait;wait;wait;wait;wait;wait"
alias d5 "d1;d1;d1;d1;d1"
alias s1 "d5;d5"
alias s2 "s1;s1"
alias s5 "s2;s2;s1"
alias s10 "s5;s5"
set deathmatch 0
set maxclients 1
map kos1
s10
s10
s10
s10
s10
s10
s10
s10
s10
s10
echo OMTEST marker save
save i1dload
s5
echo OMTEST marker load
load i1dload
s10
s5
echo OMTEST marker walk
+forward
s2
-forward
s5
echo OMTEST marker quit
quit
