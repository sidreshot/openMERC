// MENU-SCRATCH: one key binding through the keys page with the d-pad and Enter (scratch_controls.cfg)
menuoff;menu main;menu keys
om_after 70 "om_menukey none 0 0"
om_after 76 "om_keyevent aux31"
om_after 80 "om_keyevent aux31"
om_after 84 "om_menuprobe bindrow"
om_after 88 "om_keyevent enter"
om_after 94 "om_keyevent p"
om_after 100 "echo BINDLIST;bindlist"
om_after 110 "om_menushot ctl_bind"
om_after 120 "exec scratch_controls_scale.cfg"
