// MENU-SCRATCH: sparse pages without the page zoom
set menu_pagezoom 0
menu game
om_after 300 "om_menushot game"
om_after 380 "menuoff;menu stats"
om_after 440 "om_menushot stats"
om_after 450 "menuoff;menu player2"
om_after 510 "om_menushot player2"
om_after 520 "menuoff;menu start"
om_after 580 "om_menushot start"
om_after 600 "quit"
