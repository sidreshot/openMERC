// coordinates for 1920x1080 (virtual 960x540); at 2560x1440 the click lands on another difficulty (no save slots)
// MENU2: in-game HUD at the run's size, then a save and the load/save pages (file request list)
set vid_maxfps 60
om_after 200 "menu main"
om_after 260 "menu game3"
om_after 300 "om_menukey mouse1 480 233"
om_after 1300 "om_keyevent escape"
om_after 2200 "screenshot"
om_after 2210 "save omtest1"
om_after 2300 "save omtest2"
om_after 2400 "screenshot"
om_after 2500 "menu main"
om_after 2560 "menu load"
om_after 2620 "om_menushot hs_load"
om_after 2630 "om_menudump"
om_after 2640 "menuoff;menu save"
om_after 2700 "om_menushot hs_save"
om_after 2710 "om_menudump"
om_after 2720 "menuoff"
om_after 2730 "load omtest1"
om_after 3300 "screenshot"
om_after 3310 "echo HS done"
om_after 3400 "quit"