// MENU-SCRATCH: the main menu at start-up, "menu amain" (the former animated menu) and Esc in a level
om_after 250 "om_menushot startup"
om_after 260 "menuoff;menu amain"
om_after 330 "om_menushot amain"
om_after 340 "menuoff;map tsr1"
om_after 1900 "om_keyevent ESCAPE"
om_after 2000 "om_keyevent ESCAPE"
om_after 2150 "om_menushot ingame_esc"
om_after 2200 "quit"
