// MENU-SCRATCH: the in-game menu (Esc), the save page, the death screen and the end screens
map tsr1
om_after 1700 "om_keyevent ESCAPE"
om_after 1750 "om_menudump"
om_after 1800 "om_keyevent ESCAPE"
om_after 1950 "om_menushot ingame_esc"
om_after 1960 "om_menudump"
om_after 2000 "menu save"
om_after 2100 "om_menushot save"
om_after 2110 "menu video"
om_after 2200 "om_menushot ingame_video"
om_after 2210 "menuoff"
om_after 2220 "kill"
om_after 2300 "om_menushot death_early"
om_after 2310 "om_menudump"
om_after 2700 "om_menushot death"
om_after 2710 "om_menudump"
om_after 2720 "menuoff;menu endgame"
om_after 2850 "om_menushot endgame"
om_after 2860 "menuoff;menu missionfailed"
om_after 2990 "om_menushot missionfailed"
om_after 3000 "menuoff;menu endstats"
om_after 3130 "om_menushot endstats"
om_after 3140 "echo SCRATCH ingame done"
om_after 3150 "quit"
