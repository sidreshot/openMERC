// MENU2: save through the in-game menu (thumbnail taken when the menus open), then the load page
// coordinates for 2560x1440 (virtual 853x480); savemenu.cfg has the same steps for 1920x1080
set vid_maxfps 60
om_after 200 "menu main"
om_after 260 "menu game3"
om_after 300 "om_menukey mouse1 426 203"
om_after 1300 "om_keyevent escape"
om_after 2200 "menu main"
om_after 2260 "menu save"
om_after 2320 "om_menushot sm_save"
om_after 2330 "om_menukey none 418 157"
om_after 2340 "om_menukey mouse1 418 157"
om_after 2450 "om_menushot sm_saved"
om_after 2460 "menuoff"
om_after 2600 "menu main"
om_after 2660 "menu save"
om_after 2720 "om_menukey mouse1 418 157"
om_after 2830 "menuoff"
om_after 2900 "menu main"
om_after 2960 "menu load"
om_after 3020 "om_menushot sm_load"
om_after 3030 "echo SM done"
om_after 3040 "quit"