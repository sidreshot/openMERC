// MENU2: video page - resolution list from the display, Apply and persistence
menu main
om_after 300 "menuoff;menu video"
om_after 380 "om_menushot vid0"
om_after 390 "echo VT stage=$menu_mode"
om_after 400 "set menu_mode 1600x900;set menu_hudscale 4;horplus 0"
om_after 410 "menuoff;exec menus/applyvid.cfg;vid_restart"
om_after 600 "echo VT applied r_mode=$r_mode w=$r_customwidth h=$r_customheight hud=$scr_hudscale"
om_after 610 "menu main;menu video"
om_after 700 "om_menushot vid1"
om_after 710 "echo VT stage2=$menu_mode"
om_after 720 "set menu_mode desktop"
om_after 730 "menuoff;exec menus/applyvid.cfg"
om_after 740 "echo VT desk r_mode=$r_mode"
om_after 750 "set r_mode -1;set r_customwidth 1600;set r_customheight 900"
om_after 800 "quit"
