// MENU2: New Game, skip the intro cinematic (toggleconsole during the freeze requests a skip), then play
set vid_maxfps 60
// cl_cinematicfreeze printed before and after the key
om_after 200 "menu main"
om_after 260 "menu game3"
om_after 300 "om_menukey mouse1 480 233"
om_after 1200 "screenshot"
om_after 1201 "cl_cinematicfreeze;sv_jumpcinematic"
om_after 1300 "om_keyevent escape"
om_after 1310 "echo SKIP requested"
om_after 1500 "screenshot"
om_after 1501 "cl_cinematicfreeze;sv_jumpcinematic;om_entdump 1"
om_after 2500 "screenshot"
om_after 2501 "om_entdump 1"
om_after 2600 "menu main"
om_after 2700 "screenshot"
om_after 2800 "menuoff"
om_after 3500 "screenshot"
om_after 3501 "om_entdump 1"
om_after 3600 "echo NGS done"
om_after 3700 "quit"
