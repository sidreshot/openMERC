// MENU2: New Game from the menu (stock newgame.cfg path)
om_after 300 "menu main"
om_after 400 "om_menushot ng_main"
om_after 410 "menuoff;menu game3"
om_after 470 "om_menushot ng_game3"
om_after 480 "exec menus/newgame.cfg"
om_after 600 "om_menushot ng_600"
om_after 1000 "screenshot"
om_after 2000 "screenshot"
om_after 4000 "screenshot"
om_after 4100 "echo NG done"
om_after 4200 "quit"
