// MENU2: keyboard and gamepad navigation on the audio page (om_keyevent = the normal key path)
// keyboard: TAB walks every interactive widget (SPEC-801 7.5); gamepad (menu_gamepad 1):
// AUX31/AUX29 d-pad down/up = page content, AUX32/AUX30 d-pad left/right = arrows,
// AUX10/AUX11 shoulders = tabs and fixed buttons, JOY1 A = ENTER, JOY2 B = ESCAPE
menu main
om_after 300 "menu audio"
om_after 360 "om_menukey none 0 0"
om_after 370 "echo NAV start;s_om_gain;s_volume"
om_after 380 "om_keyevent tab"
om_after 390 "om_keyevent tab"
om_after 400 "om_menushot nav_tab2"
om_after 410 "om_keyevent aux31"
om_after 420 "om_menushot nav_pad1"
om_after 430 "om_keyevent aux30"
om_after 435 "om_keyevent aux30"
om_after 440 "echo NAV after 2x pad right;s_om_gain;s_volume"
om_after 450 "om_keyevent aux31"
om_after 460 "om_keyevent aux32"
om_after 465 "om_keyevent aux32"
om_after 470 "echo NAV after down + 2x pad left;s_om_gain;s_volume"
om_after 475 "om_menushot nav_pad2"
om_after 480 "om_keyevent aux31"
om_after 482 "om_keyevent aux31"
om_after 484 "om_keyevent aux31"
om_after 486 "om_keyevent aux31"
om_after 488 "om_keyevent aux31"
om_after 490 "om_keyevent aux31"
om_after 492 "om_keyevent aux31"
om_after 500 "om_menushot nav_pad9"
om_after 510 "om_keyevent aux31"
om_after 520 "om_menushot nav_pad10"
om_after 530 "om_keyevent aux29"
om_after 540 "om_menushot nav_pad_up"
om_after 550 "om_keyevent aux11"
om_after 560 "om_menushot nav_rb1"
om_after 570 "om_keyevent aux10"
om_after 575 "om_keyevent aux10"
om_after 580 "om_menushot nav_lb"
