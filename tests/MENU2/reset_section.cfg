// MENU2: "Reset Section" (om_resetcvars) after the page has been read brings the settings back to their defaults.
// The menus named each cvar of a page with Cvar_Get(name, ""), which became the cvar's default, so the reset set
// the settings to "" - on a phone the touch buttons went to size 0 and alpha 0 (no way to play or reach the menu
// by touch) and the video page's frame limit to "" (no limit). Menu widgets now use Cvar_GetRef.
// Run with a fresh user folder (no config.cfg) and the touch pages:
//   openMerc +set in_touch 1 +exec reset_section.cfg
// Expected after each "Reset Section": touch_alpha 0.35, touch_size 1, touch_sens 1, touch_joyradius 0.13,
// vid_maxfps 0 (before the fix: "" for all of them). The unit test is engine/src/common/test_cvar.c (cvar_test).
echo ==== START values
touch_alpha
touch_size
vid_maxfps
echo ==== touch page Reset Section
set touch_alpha 0.5
set touch_size 1.4
set touch_sens 2
menu keys
om_resetcvars touch_sens touch_size touch_alpha touch_joyradius
touch_alpha
touch_size
touch_sens
touch_joyradius
echo ==== video page first tab Reset Section
set vid_maxfps 30
menu video
om_resetcvars vid_surfacescale vid_maxfps
vid_maxfps
echo ==== END
quit
