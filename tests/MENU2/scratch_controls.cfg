// MENU-SCRATCH: every control of the settings pages driven by the gamepad path
// (d-pad down = next control, d-pad right = change it); om_menuprobe logs the control
// and its cvar before and after (one file per page: om_after keeps 128 pending lines)
set menu_gamepad 1
menu main
om_after 300 "exec scratch_controls_video.cfg"
