// Implements: SPEC-001 export 0x40 (G10 black box: the save limit at skill 3, two saves allowed)
exec g10common.cfg
set fixedtime 25
map tsr1
s5
+use
d1
-use
s5
echo G10 marker save 1
save g10a
s2
echo G10 marker save 2
save g10b
s2
echo G10 marker save 3
save g10c
s2
echo G10 marker savesleft
savesleft
s1
echo G10 marker load a
load g10a
s5
echo G10 marker savesleft after load
savesleft
s1
record g10dem
s1
echo G10 marker save 4
save g10d
s2
s5
stop
echo G10 marker paused
paused
s2
echo G10 marker quit
quit
