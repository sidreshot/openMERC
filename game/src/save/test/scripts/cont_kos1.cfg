// Implements: SPEC-752 (G10 black box, kos1 mid-combat: walk into the first shotgunner (G2's combat case), then
// continuation after a save; god mode (cheat heretic) keeps the player alive while the characters shoot. save a, record demo conta over the next 100
// frames with the same input, save b - then load a, record contc over 100 frames with the same input, save c)
exec g10common.cfg
set fixedtime 25
map kos1
s5
+use
d1
-use
s5
heretic
+forward
s5
-forward
s5
echo G10 marker save a
save g10a
record g10conta
+forward
s2
-forward
s8
stop
echo G10 marker save b
save g10b
s1
set g10_savetest 0
echo G10 marker load a
load g10a
s1
set paused 0
record g10contc
+forward
s2
-forward
s8
stop
echo G10 marker save c
save g10c
s1
echo G10 marker quit
quit
