// Implements: SPEC-303 / SPEC-752 (G10 black box: tsr1, intro skipped, two saves, the save limit)
exec g10common.cfg
set fixedtime 25
map tsr1
s5
echo G10 marker skip
+use
d1
-use
s10
echo G10 marker save a
save g10a
s5
echo G10 marker save b
save g10b
s2
savesleft
s1
echo G10 marker quit
quit
