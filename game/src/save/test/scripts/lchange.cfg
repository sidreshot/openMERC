// Implements: SPEC-752 / SPEC-303 (G10 black box: a level change - gamemap writes the automatic save with the
// client's persistent data - then a normal save on the new level, a load of it, and a load of the automatic save)
exec g10common.cfg
set fixedtime 25
map tsr1
s5
+use
d1
-use
s5
elbow
s2
weaponselect 5
+forward
s2
-forward
s2
echo G10 marker gamemap
gamemap tsr2
s5
+use
d1
-use
s5
echo G10 marker save l
save g10l
s5
echo G10 marker load l
load g10l
s2
set paused 0
s5
save g10m
s2
echo G10 marker load auto
load auto
s5
set paused 0
s5
save g10n
s2
echo G10 marker quit
quit
