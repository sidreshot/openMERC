// F5 (SPEC-AMEND-005 G5.7, G5.12): listen server with cheats 1 and bot_wp_edit 1 from the command line
// (run_listen.ps1 -Extra "+set cheats 1 +set bot_wp_edit 1" -JoinAt 32). The original SoF.exe runs one wait per
// frame, about 60 frames/s in a level on the hidden desktop (w1k ~ 16 s).
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
set developer 1
echo F5MARK 0
w1k
echo F5MARK edit-check
bot_wp_edit
bot_wp_whichpath 130
w10
bot_wp_whichpath 126
bot_wp_whichpath 127
bot_wp_whichpath 68
bot_wp_whichpath 1
bot_wp_whichpath 159
bot_wp_pathinfo 0
w10
bot_wp_pathinfo 1
w10
bot_wp_pathinfo 2
w10
bot_wp_pathinfo 6
w10
bot_wp_pathinfo 14
w10
bot_wp_pathinfo 15
w10
bot_wp_pathinfo 16
w10
bot_wp_pathinfo
w10
bot_wp_whichpath 5
w10
bot_wp_verifypaths
w10
echo F5MARK makewp
makewp
w10
bot_wp_whichpath 160
echo F5MARK wait-join
w1k
echo F5MARK after-join
bot_wp_edit
makewp
w100
echo F5MARK end
quit
