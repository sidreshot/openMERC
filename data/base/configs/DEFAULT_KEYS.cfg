// OpenMerc default controls (modern layout)
// Run last by OpenMerc's default.cfg on every start (after the stock
// misc defaults); config.cfg runs afterwards and starts with unbindall,
// so an existing user setup always wins.
// Also used by the Defaults button of the key bindings page.

unbindall

// movement
bind w +forward
bind s +back
bind a +moveleft
bind d +moveright
bind uparrow +forward
bind downarrow +back
bind leftarrow +left
bind rightarrow +right
bind space +moveup
bind lctrl +movedown
bind c +movedown
bind lshift +speed

// actions (hold E and press A or D to lean, as in the original)
bind e +use
bind f +leanleft
bind g +leanright
bind r reload

// weapons
bind mouse1 +attack
bind mouse2 +altattack
bind mouse3 +weaponextra1
bind mwheelup weapprev
bind mwheeldown weapnext
bind q weaplast
bind x weapondrop
bind 1 "weaponselect 1"
bind 2 "weaponselect 2"
bind 3 "weaponselect 3"
bind 4 "weaponselect 4"
bind 5 "weaponselect 5"
bind 6 "weaponselect 6"
bind 7 "weaponselect 7"
bind 8 "weaponselect 8"
bind 9 "weaponselect 9"
bind 0 "weaponselect 10"

// items
bind h itemuse
bind ] itemnext
bind [ itemprev
bind enter itemuse

// multiplayer and interface
bind tab score
bind t messagemode
bind y messagemode2
bind ` toggleconsole
bind f1 "menu keys"
bind f2 "menu video"
bind f3 "menu audio"
bind f6 quicksave
bind f9 quickload
bind f11 screenshot
bind o "menu objectives"

// mouse: free look, not inverted
set freelook 1
set lookspring 0
set m_invert_y 0
set m_invert_x 0
set cl_run 1
bind - "weaponselect 11"
bind = "weaponselect 12"
