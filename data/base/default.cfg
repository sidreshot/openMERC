//----------------------------------------------
// OpenMerc (MENU2): START-UP DEFAULTS
// Executed first on every start (SPEC-301 2.1); the user's config.cfg
// runs afterwards and keeps every setting the user saved.
// The stock sound and misc defaults run first, then OpenMerc's own video
// and control defaults, so the modern layout (WASD, always run, free
// look) is what a fresh profile gets.
//----------------------------------------------

exec default_sound.cfg
exec default_misc.cfg
exec default_video.cfg
exec configs/default_keys.cfg

set viewsize		100
set name		"John Mullins"
set dmflags		4100

// commands the menus use (SPEC-301 2.1)
alias newgame "exec menus/newgame.cfg"
alias tutorial "exec menus/tutorial.cfg"
alias start "menu disclaimer"
alias respawn "menu load"
alias dedicated_start "exec dedicated.cfg"

// inventory and statistics cvars
exec menus/reset.cfg
