//----------------------------------------------
// OpenMerc (V1): DEFAULT VIDEO SETTINGS
// the Defaults button of the video page, the same values the engine
// starts with on a PC without a config (docs/DEVIATIONS.md)
//----------------------------------------------

// display: desktop resolution, borderless fullscreen, vsync, frame rate = display refresh
set r_mode                      -2
set vid_fullscreen              2
set r_vsync                     1
set vid_maxfps                  0
set vid_renderer                gl3

// view
set fov                         95
set horplus                     1
set scr_aspect                  1
set scr_hudscale                0

// textures and filtering: maximum quality (owner rule); MSAA falls back
// to 4x/2x/off by itself where the driver refuses 8x
set gl_texturemode              GL_LINEAR_MIPMAP_LINEAR
set r_anisotropic               16
set r_msaa_samples              8
set gl_picmip                   0
set gl_pictip                   0
set ghl_mip                     0

// lighting, detail
set gl_modulate                 1
set gl_detailtexturing          1
set gl_detailtexturingdistance  1000
set gl_dlightintensity          2
set ghl_light_method            3
set ghl_specular                1
set ghl_shadows                 2

// colour table
set vid_gamma                   0.0
set vid_contrast                0.6
set vid_brightness              0.6

// end
