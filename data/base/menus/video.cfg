// OpenMerc (V1): staging of the video page - nothing changes until Apply (menus/applyvid.cfg)
set menu_settings_changed 0

om_vidstage
set menu_fullscreen $vid_fullscreen
set menu_vsync $r_vsync
set menu_maxfps $vid_maxfps
set menu_fov $fov
set menu_aspect $scr_aspect
set menu_anisotropic $r_anisotropic
set menu_msaa $r_msaa_samples
set menu_hudscale $scr_hudscale
set menu_uiscale $ui_scale
set menu_gamma $vid_gamma
set menu_contrast $vid_contrast
set menu_brightness $vid_brightness
set menu_modulate $gl_modulate
