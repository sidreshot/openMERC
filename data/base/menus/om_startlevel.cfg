// OpenMerc level select (menus/m_levels.rmf): "set om_startmap <map>; exec menus/om_startlevel.cfg" starts a new
// campaign at that level, like newgame (menus/newgame.cfg) does at tsr1; om_levelkit gives the player that
// mission's weapons and items on the first spawn (game: ClientBegin)
exec menus/reset.cfg

set sk_saving $menu_sk_saving
set sk_spawning $menu_sk_spawning
set sk_toughness $menu_sk_toughness
set sk_maxencum $menu_sk_maxencum
set cheats $menu_cheats

set skill $menu_skill
set cl_predict_weapon 0
set deathmatch 0
set om_levelkit 1
loading
disconnect
map $om_startmap
