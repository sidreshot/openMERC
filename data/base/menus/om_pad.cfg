// OpenMerc: the standard gamepad layout, by button position (SDL's standard gamepad mapping: Xbox names here,
// the same places on PlayStation and Nintendo pads). Set by itself when a gamepad connects and none of its
// buttons is bound (input/sdl3.c IN_PadAutoBind), by the gamepad page's "Standard Buttons" and by the key
// defaults (configs/DEFAULT_KEYS.cfg). Only gamepad keys are touched. Start opens the menu (fixed).
// JOY1-4 = A B X Y, AUX5 View, AUX8/9 stick clicks, AUX10/11 LB RB, AUX23/24 LT RT,
// AUX29 d-pad up, AUX30 right, AUX31 down, AUX32 left.

// triggers: fire, alternate fire
bind AUX24 +attack
bind AUX23 +altattack
// A jump, B crouch, X reload, Y next weapon
bind JOY1 +moveup
bind JOY2 +movedown
bind JOY3 reload
bind JOY4 weapnext
// RB use (doors, switches), LB uses the selected item (grenade: throws it)
bind AUX11 +use
bind AUX10 itemuse
// d-pad: up last weapon, down next item, left / right lean
bind AUX29 weaplast
bind AUX31 itemnext
bind AUX32 +leanleft
bind AUX30 +leanright
// stick clicks: left walk, right previous weapon
bind AUX8 +speed
bind AUX9 weapprev
// View / Back: score and objectives
bind AUX5 score
