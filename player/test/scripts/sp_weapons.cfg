// Implements: SPEC-600, SPEC-601 (black-box session: single player, every weapon fired, reloaded and switched)
// Single player (on a deathmatch map, no intro cinematic) keeps fixedtime (multiplayer forces it to 0): every
// frame is 25 ms of game time, so the session is deterministic. w10 = 4 frames = one 0.1 s server frame.
// No semicolons in comments: the command buffer splits lines at them.
unbindall
alias w10 "wait;wait;wait;wait"
alias w50 "w10;w10;w10;w10;w10"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
set fixedtime 25
set deathmatch 0
set maxclients 1
set bestweap safe
map dm/nycdm4
