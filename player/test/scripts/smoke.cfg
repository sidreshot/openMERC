// Implements: SPEC-003 (smoke session: load a deathmatch map, give the cheat kit, fire, reload, quit)
// fixedtime 10: every frame advances 10 ms, so 10 waits = 0.1 s of game time whatever the frame rate.
// No semicolons in comments: the command buffer splits lines at them.
unbindall
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
set fixedtime 10
set deathmatch 1
set dmflags 0
set timelimit 0
set fraglimit 0
map dm/nycdm4
w100
w100
w100
echo OMTEST marker elbow
elbow
w100
w100
echo OMTEST marker fire
+attack
w100
-attack
w100
echo OMTEST marker reload
reload
w100
w100
echo OMTEST marker quit
quit
