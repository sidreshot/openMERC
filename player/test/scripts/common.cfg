// Implements: SPEC-600 (session helpers). Single player on a deathmatch map (no intro cinematic), fixedtime 25.
// Measured: one wait is about 12 ms of game time here, so d1 is about 0.1 s and s1 about 1 s.
// No semicolons in comments: the command buffer splits lines at them.
unbindall
alias d1 "wait;wait;wait;wait;wait;wait;wait;wait"
alias d5 "d1;d1;d1;d1;d1"
alias s1 "d5;d5"
alias s2 "s1;s1"
alias s5 "s2;s2;s1"
set fixedtime 25
set deathmatch 0
set maxclients 1
set bestweap safe
map dm/nycdm4
s2
heretic
ninja
